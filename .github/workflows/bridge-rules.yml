rules:
  - id: bridge-missing-chain-id
    patterns:
      - pattern-either:
          - pattern: |
              function $FUNC(...) ... {
                ...
                ecrecover(...)
                ...
              }
    message: "Potential missing chainId in signature verification. Bridge messages must bind the source chain ID."
    languages: [solidity]
    severity: ERROR

  - id: bridge-replay-no-nonce
    patterns:
      - pattern: |
          function $FUNC(...) ... {
            ...
            $CALL(...)
            ...
          }
      - pattern-not: |
          function $FUNC(...) ... {
            ...
            require($PROCESSED[$ID] == false);
            ...
          }
    message: "Potential replay: inbound message handler does not check a processed-message mapping before execution."
    languages: [solidity]
    severity: ERROR

  - id: bridge-hardcoded-bridge-address
    patterns:
      - pattern: |
          address constant $NAME = $ADDR;
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)(bridge|relay|messenger|endpoint)
    message: "Hardcoded bridge/relay address. If the bridge is upgraded, this adapter cannot adapt."
    languages: [solidity]
    severity: WARNING
