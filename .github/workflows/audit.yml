name: Audit Any Repo — Bridge-Aware

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Repo (owner/name)"
        required: true
      target_branch:
        description: "Branch"
        required: false
        default: main

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_REPO: ${{ inputs.target_repo }}
    steps:
      # ================================================================
      # STEP 0 — CHECKOUT WORKFLOW REPO (Critical for BridgeGuard)
      # ================================================================
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Clone target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ inputs.target_branch }}
          path: target
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 1
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: foundry-rs/foundry-toolchain@v1

      # ================================================================
      # STEP 1 — DETECT, INSTALL, BUILD
      # ================================================================
      - name: Detect project, install dependencies, build
        working-directory: target
        run: |
          set -euo pipefail

          PROJECT="plain"
          if [ -f foundry.toml ]; then
            PROJECT="foundry"
          elif [ -f hardhat.config.js ] || [ -f hardhat.config.ts ]; then
            PROJECT="hardhat"
          elif [ -f truffle-config.js ]; then
            PROJECT="truffle"
          fi
          echo "PROJECT=$PROJECT" | tee ../project.txt

          # =========================================================
          # 1. NODE DEPENDENCY INSTALLATION (Handles Bun and npm conflicts)
          # =========================================================
          if [ -f package.json ]; then
            echo "package.json found — installing node dependencies"
            if [ -f bun.lockb ]; then
              echo "Bun detected — running bun install"
              bun install || true
            elif [ -f pnpm-lock.yaml ]; then
              corepack enable && pnpm install || true
            elif [ -f yarn.lock ]; then
              yarn install || true
            else
              # Fallback: Try npm ci, then legacy-peer-deps, then force
              npm ci --no-audit --no-fund || \
              npm install --no-audit --no-fund --legacy-peer-deps || \
              npm install --no-audit --no-fund --force || true
            fi
          fi

          # =========================================================
          # 2. FOUNDRY BUILD (Respects project-specific solc and exclusions)
          # =========================================================
          if [ "$PROJECT" = "foundry" ]; then
            # Soldeer dependencies
            if grep -q '^\[dependencies\]' foundry.toml 2>/dev/null; then
              echo "Soldeer detected — installing dependencies"
              forge soldeer install --config-location foundry || true
            fi

            # Git submodules
            forge install --no-commit || true

            # Let Foundry search node_modules for hybrid projects
            if [ -d node_modules ]; then
              export FOUNDRY_LIBS="lib,node_modules"
              echo "FOUNDRY_LIBS set to: $FOUNDRY_LIBS"
            fi

            forge clean || true

            # FIX: Force the solc version if foundry.toml specifies one.
            # This solves 0x-settler's 0.8.25 requirement.
            SOLC_VER=$(grep -E '^solc_version\s*=' foundry.toml | head -1 | cut -d'"' -f2 || echo "")
            if [ -n "$SOLC_VER" ]; then
              echo "Foundry.toml specifies solc $SOLC_VER — forcing this version"
              export FOUNDRY_SOLC_VERSION="$SOLC_VER"
            fi

            # FIX: Run forge build and let it respect no_match_path.
            # We add || true so the Build Gate step can catch the exit code cleanly.
            echo "Running: forge build --force"
            forge build --force 2>&1 | tee ../forge-build.log || true

            # Generate remappings if missing
            if [ ! -s remappings.txt ]; then
              forge remappings > remappings.txt 2>/dev/null || true
            fi
            echo "=== remappings.txt ==="
            cat remappings.txt || echo "(none)"

          # =========================================================
          # 3. HARDHAT / TRUFFLE
          # =========================================================
          elif [ "$PROJECT" = "hardhat" ] || [ "$PROJECT" = "truffle" ]; then
            ./node_modules/.bin/hardhat compile 2>&1 | tee ../forge-build.log || true
          fi

          # =========================================================
          # 4. SOURCE FILE DISCOVERY
          # =========================================================
          find . -name "*.sol" \
            -not -path "*/node_modules/*" \
            -not -path "*/dependencies/*" \
            -not -path "*/lib/*" \
            -not -path "*/out/*" \
            -not -path "*/cache/*" \
            -not -path "*/broadcast/*" \
            -not -path "*/artifacts/*" \
            > ../sol-files.txt 2>/dev/null || true
          echo "=== .sol files (top-level) ==="
          head -30 ../sol-files.txt || true
            

      # ================================================================
      # STEP 1b — BUILD STATUS GATE
      # ================================================================
      - name: Verify Build Artifacts
        working-directory: target
        run: |
          set -euo pipefail
          BUILD_OK=false
          if [ -f foundry.toml ]; then
            [ -d out ] && [ -n "$(find out -name '*.json' -print -quit 2>/dev/null)" ] && BUILD_OK=true
          elif [ -f hardhat.config.js ] || [ -f hardhat.config.ts ]; then
            [ -d artifacts ] && [ -n "$(find artifacts -name '*.json' -print -quit 2>/dev/null)" ] && BUILD_OK=true
          else
            BUILD_OK=true
          fi
          if [ "$BUILD_OK" = false ]; then
            echo "BUILD_FAILED" > ../build-status.txt
            echo "## ⚠️ Build Failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "BUILD_OK" > ../build-status.txt
          echo "Build gate passed" | tee -a "$GITHUB_STEP_SUMMARY"

      # ================================================================
      # STEP 2 — WAKE CONFIGURATION (forge remappings → wake.toml)
      # ================================================================
      - name: Prepare Wake configuration
        working-directory: target
        continue-on-error: true
        run: |
          set -euo pipefail

          # Ask forge for the exact remappings it uses
          forge remappings > forge-remappings.txt 2>/dev/null || true

          python3 - << 'PY'
          import pathlib

          remaps = []
          p = pathlib.Path("forge-remappings.txt")
          if p.exists():
              for line in p.read_text().splitlines():
                  line = line.strip()
                  if not line or "=" not in line:
                      continue
                  # Solc treats remappings as exact prefix replacements.
                  # forge output is already in that form; drop context: prefixes.
                  if ":" in line and "=" in line.split(":", 1)[1]:
                      _, rest = line.split(":", 1)
                      if "=" in rest:
                          line = rest
                  remaps.append(line)

          # Write a wake.toml that mirrors Foundry exactly.
          # Include 'lib' in include_paths so Wake can find dependencies installed via forge.
          lines = [
              "[compiler.solc]",
              'exclude_paths = [',
              '  "dependencies",',
              '  "node_modules",',
              '  "out",',
              '  "cache",',
              '  "broadcast",',
              '  "script",',
              '  "test"',
              ']',
              'include_paths = [',
              '  "dependencies",',
              '  "node_modules",',
              '  "lib"',
              ']',
              "remappings = [",
          ]
          for r in remaps:
              lines.append(f'  "{r}",')
          lines.append("]")

          pathlib.Path("wake.toml").write_text("\n".join(lines) + "\n")
          print(f"Wrote wake.toml with {len(remaps)} forge remappings")
          for r in remaps:
              print(f"  {r}")
          PY

          echo "=== wake.toml ==="
          cat wake.toml

      # ================================================================
      # STEP 3 — SLITHER
      # ================================================================
      - name: Slither
        working-directory: target
        continue-on-error: true
        run: |
          python3 -m venv /tmp/venv-slither
          /tmp/venv-slither/bin/pip install -q slither-analyzer
          /tmp/venv-slither/bin/slither . --exclude-dependencies \
            --json ../slither.json 2>&1 | tee ../slither.log
          [ -s ../slither.json ] || { echo "FATAL: slither.json empty" >&2; exit 1; }

      # ================================================================
      # STEP 4 — SEMGREP (generic smart-contracts)
      # ================================================================
      - name: Semgrep — generic
        working-directory: target
        continue-on-error: true
        run: |
          python3 -m venv /tmp/venv-semgrep
          /tmp/venv-semgrep/bin/pip install -q semgrep
          SOL_DIRS=$(find . -maxdepth 2 -type d \( -name src -o -name contracts \) \
            -not -path "*/node_modules/*" -not -path "*/lib/*" \
            -not -path "*/dependencies/*" -not -path "*/out/*" | tr '\n' ' ')
          [ -z "$SOL_DIRS" ] && SOL_DIRS="."
          /tmp/venv-semgrep/bin/semgrep --config p/smart-contracts \
            --include="*.sol" --sarif --output ../semgrep.sarif $SOL_DIRS || true
          [ -s ../semgrep.sarif ] || { echo "FATAL: semgrep.sarif empty" >&2; exit 1; }

      # ================================================================
      # STEP 5 — SOLAST (bridge-specific AST scan)
      # ================================================================
      - name: SolAST — bridge AST scan
        working-directory: target
        continue-on-error: true
        run: |
          SOLAST_DIRS="."
          [ -d src ] && SOLAST_DIRS="src"
          [ -d contracts ] && SOLAST_DIRS="contracts"
          [ -d src ] && [ -d contracts ] && SOLAST_DIRS="src contracts"

          npx --yes @snovon/solast scan \
            --format sarif --dedup $SOLAST_DIRS \
            > ../solast.sarif 2> ../solast.log || true

          python3 - << 'PY'
          import json, pathlib, sys
          p = pathlib.Path("../solast.sarif")
          if not p.exists() or p.stat().st_size == 0:
              print("SOLAST_SARIF_EMPTY", file=sys.stderr)
              sys.exit(1)
          try:
              d = json.loads(p.read_text())
              if "runs" not in d or not isinstance(d["runs"], list):
                  print("SOLAST_SARIF_INVALID — missing runs[]", file=sys.stderr)
                  sys.exit(1)
              print(f"SolAST SARIF valid: {len(d['runs'])} run(s)")
          except Exception as e:
              print(f"SOLAST_SARIF_PARSE_ERROR: {e}", file=sys.stderr)
              sys.exit(1)
          PY

      # ================================================================
      # STEP 6 — BRIDGE SEMGREP (Sanitize YAML in Python)
      # ================================================================
      - name: Semgrep — custom bridge rules
        working-directory: target
        continue-on-error: true
        run: |
          set -euo pipefail

          BRIDGE_RULES=""
          for candidate in \
            "$GITHUB_WORKSPACE/.github/semgrep/bridge-rules.yml" \
            "$GITHUB_WORKSPACE/.semgrep/bridge-rules.yml" \
            "$GITHUB_WORKSPACE/bridge-rules.yml"; do
            if [ -f "$candidate" ]; then
              BRIDGE_RULES="$candidate"
              break
            fi
          done

          if [ -z "$BRIDGE_RULES" ]; then
            echo "BRIDGE_RULES_NOT_FOUND — writing fallback via Python" | tee ../bridge-semgrep.log
            python3 - << 'PY'
          import pathlib
          rules = """rules:
            - id: bridge-missing-chain-id
              patterns:
                - pattern: |
                    function $FUNC(...) ... {
                      ...
                      ecrecover(...)
                      ...
                    }
              message: "Potential missing chainId in signature verification."
              languages: [solidity]
              severity: ERROR
            - id: bridge-replay-no-nonce
              patterns:
                - pattern: |
                    function $FUNC(...) ... {
                      ...
                      $CALL(...)
                      ...
                    }
                - pattern-not: |
                    function $FUNC(...) ... {
                      ...
                      require($PROCESSED[$ID] == false);
                      ...
                    }
              message: "Potential replay: no processed-message check."
              languages: [solidity]
              severity: ERROR
            - id: bridge-hardcoded-bridge-address
              patterns:
                - pattern: |
                    address constant $NAME = $ADDR;
                - metavariable-regex:
                    metavariable: $NAME
                    regex: (?i)(bridge|relay|messenger|endpoint)
              message: "Hardcoded bridge/relay address."
              languages: [solidity]
              severity: WARNING
          """
          pathlib.Path("bridge-rules.yml").write_text(rules)
          PY
            BRIDGE_RULES="bridge-rules.yml"
          else
            cp "$BRIDGE_RULES" bridge-rules.yml
            echo "Using bridge rules from: $BRIDGE_RULES" | tee ../bridge-semgrep.log
          fi

          # Strip BOM, leading whitespace, and ensure 'rules:' starts at column 0
          python3 - << 'PY'
          import pathlib
          p = pathlib.Path("bridge-rules.yml")
          if p.exists():
              content = p.read_text(encoding="utf-8-sig").strip()
              # Ensure it starts with 'rules:' at column 0
              if not content.startswith("rules:"):
                  if "rules:" in content:
                      content = content[content.index("rules:"):]
                  else:
                      content = "rules:\n" + content
              p.write_text(content + "\n")
          PY

          # Validate rules before scanning
          /tmp/venv-semgrep/bin/semgrep --validate --config bridge-rules.yml \
            2>&1 | tee -a ../bridge-semgrep.log || {
            echo "BRIDGE_RULES_INVALID" | tee -a ../bridge-semgrep.log
            exit 1
          }

          DIRS="."
          [ -d src ] && DIRS="src"
          [ -d contracts ] && DIRS="contracts"
          [ -d src ] && [ -d contracts ] && DIRS="src contracts"

          /tmp/venv-semgrep/bin/semgrep --config bridge-rules.yml \
            --include="*.sol" --sarif --output ../bridge-semgrep.sarif \
            $DIRS 2>&1 | tee -a ../bridge-semgrep.log || true

          [ -s ../bridge-semgrep.sarif ] || {
            echo "BRIDGE_SEMGREP_EMPTY" | tee -a ../bridge-semgrep.log
            exit 1
          }

      # ================================================================
      # STEP 7 — WAKE DETECT (compile first, then detect)
      # ================================================================
      - name: Wake Detect
        working-directory: target
        continue-on-error: true
        run: |
          python3 -m venv /tmp/venv-wake
          /tmp/venv-wake/bin/pip install -q 'eth-wake>=4.22'

          /tmp/venv-wake/bin/wake compile 2>&1 | tee ../wake-compile.log || {
            echo "WAKE_COMPILE_FAILED" | tee -a ../wake.log
            exit 1
          }

          /tmp/venv-wake/bin/wake detect all \
            2>&1 | tee ../wake.log

          if ! grep -qiE 'detector|finding|issue|vulnerability|detection' ../wake.log 2>/dev/null; then
            echo "WAKE_NO_FINDINGS_OR_EMPTY_OUTPUT" | tee -a ../wake.log
          fi

      # ================================================================
      # STEP 8 — HALMOS
      # ================================================================
      - name: Halmos
        working-directory: target
        continue-on-error: true
        run: |
          PROJECT=$(cut -d= -f2 ../project.txt)
          if [ "$PROJECT" != "foundry" ]; then
            echo "HALMOS_SKIPPED — not a Foundry project" > ../halmos.log
            exit 0
          fi

          CHECK_COUNT=$(grep -rE 'function\s+(check_|invariant_)' \
            --include="*.sol" src test 2>/dev/null | wc -l)
          if [ "$CHECK_COUNT" -eq 0 ]; then
            echo "HALMOS_NO_TESTS — no check_ or invariant_ functions found" > ../halmos.log
            exit 0
          fi

          python3 -m venv /tmp/venv-halmos
          /tmp/venv-halmos/bin/pip install -q 'halmos>=0.3.3'
          /tmp/venv-halmos/bin/halmos --function check_ --loop 5 \
            > ../halmos.log 2>&1 || true

          if grep -qi "Build failed\|Compiler run failed" ../halmos.log; then
            echo "HALMOS_BUILD_FAILED" >> ../halmos.log
          fi

      # ================================================================
      # STEP 9 — MYTHRIL
      # ================================================================
      - name: Mythril
        working-directory: target
        continue-on-error: true
        run: |
          : > ../mythril.log

          SRC_FILE=$(find src contracts -maxdepth 3 -name "*.sol" 2>/dev/null | head -1)
          [ -z "$SRC_FILE" ] && SRC_FILE=$(find . -maxdepth 3 -name "*.sol" 2>/dev/null \
            | grep -v node_modules | grep -v '/lib/' | grep -v '/dependencies/' | head -1)

          if [ -z "$SRC_FILE" ]; then
            echo "MYTHRIL_NO_SOURCE_FILE" | tee -a ../mythril.log
            exit 1
          fi

          PRAGMA=$(grep -oP 'pragma solidity\s+\K[^;]+' "$SRC_FILE" 2>/dev/null | head -1)
          echo "Pragma: $PRAGMA  (file: $SRC_FILE)" | tee -a ../mythril.log

          SOLC_VERSION=$(echo "$PRAGMA" | grep -oP '\d+\.\d+\.\d+' | head -1)
          [ -z "$SOLC_VERSION" ] && SOLC_VERSION="0.8.20"

          pip install -q solc-select
          solc-select install "$SOLC_VERSION" 2>&1 | tee -a ../mythril.log
          solc-select use "$SOLC_VERSION"
          echo "solc version: $(solc --version)" | tee -a ../mythril.log

          if [ -s remappings.txt ]; then
            python3 - << 'PY'
          import json, pathlib
          remaps = []
          for line in pathlib.Path("remappings.txt").read_text().splitlines():
              line = line.strip()
              if not line or "=" not in line:
                  continue
              if ":" in line and "=" in line.split(":", 1)[1]:
                  dep, rest = line.split(":", 1)
                  prefix, target = rest.split("=", 1)
                  remaps.append(f"{dep}:{prefix}={target}")
              else:
                  prefix, target = line.split("=", 1)
                  remaps.append(f"{prefix}={target}")
          json.dump({"remappings": remaps}, open("mythril.config.json", "w"), indent=2)
          print(f"Wrote mythril.config.json with {len(remaps)} remappings")
          PY
          fi

          python3 -m venv /tmp/venv-mythril
          /tmp/venv-mythril/bin/pip install -q mythril

          for f in $SRC_FILE; do
            echo "=== Mythril $f ===" >> ../mythril.log
            timeout 300 /tmp/venv-mythril/bin/myth analyze "$f" \
              --solv "$SOLC_VERSION" \
              --config mythril.config.json \
              --execution-timeout 280 --max-depth 30 \
              >> ../mythril.log 2>&1 || true
          done

          if grep -qiE 'Compiler not found|solc.*not found|no compiler|solc experienced a fatal error' ../mythril.log; then
            echo "MYTHRIL_SOLC_MISMATCH" >> ../mythril.log
            exit 1
          fi
          cat ../mythril.log

      # ================================================================
      # STEP 10 — BRIDGEGUARD MCP
      # ================================================================
      - name: BridgeGuard MCP — scripted scan
        working-directory: target
        continue-on-error: true
        run: |
          set -euo pipefail
          CLIENT="$GITHUB_WORKSPACE/.github/mcp/bridgeguard-client.mjs"
          if [ ! -f "$CLIENT" ]; then
            echo "MISSING $CLIENT" | tee ../bridgeguard.log
            exit 1
          fi
          cp "$CLIENT" ../bridgeguard-client.mjs
          node ../bridgeguard-client.mjs || { echo "BRIDGEGUARD_CLIENT_FAILED" | tee -a ../bridgeguard.log; exit 1; }
          if [ ! -s ../bridgeguard-report.json ]; then
            echo "BRIDGEGUARD_REPORT_EMPTY" | tee -a ../bridgeguard.log
            exit 1
          fi

      # ================================================================
      # STEP 11 — AUTO-TRIAGE
      # ================================================================
      - name: Auto-Triage
        run: |
          python3 - << 'PY'
          import json, os, re, pathlib

          def read_json(p):
              p = pathlib.Path(p)
              if p.exists() and p.stat().st_size > 0:
                  try: return json.loads(p.read_text())
                  except Exception: return None
              return None

          project = pathlib.Path("project.txt").read_text().strip().split("=")[1] \
                    if pathlib.Path("project.txt").exists() else "unknown"

          build = pathlib.Path("build-status.txt").read_text().strip() \
                  if pathlib.Path("build-status.txt").exists() else "UNKNOWN"

          slither_high = slither_med = 0
          d = read_json("slither.json")
          slither_ok = d is not None
          if d:
              for x in d.get("results", {}).get("detectors", []):
                  imp = str(x.get("impact", "")).lower()
                  if imp == "high": slither_high += 1
                  elif imp == "medium": slither_med += 1

          semgrep_high = semgrep_med = semgrep_low = 0
          d = read_json("semgrep.sarif")
          semgrep_ok = d is not None
          if d:
              for run in d.get("runs", []):
                  for r in run.get("results", []):
                      rid = str(r.get("ruleId", ""))
                      if "solidity.security." in rid: semgrep_high += 1
                      elif "solidity.performance." in rid or "solidity.best-practice." in rid:
                          semgrep_low += 1
                      else: semgrep_med += 1

          solast_high = solast_med = 0
          d = read_json("solast.sarif")
          solast_ok = d is not None
          if d:
              for run in d.get("runs", []):
                  for r in run.get("results", []):
                      lvl = str(r.get("level", "")).lower()
                      rid = str(r.get("ruleId", "")).lower()
                      if lvl in ("error", "high") or "bridge" in rid or "replay" in rid:
                          solast_high += 1
                      else:
                          solast_med += 1

          bridge_high = bridge_med = 0
          d = read_json("bridge-semgrep.sarif")
          bridge_semgrep_ok = d is not None
          if d:
              for run in d.get("runs", []):
                  for r in run.get("results", []):
                      lvl = str(r.get("level", "")).lower()
                      if lvl in ("error", "high"): bridge_high += 1
                      elif lvl in ("warning", "medium"): bridge_med += 1
                      else: bridge_high += 1

          wake_high = 0
          wake_ok = False
          wp = pathlib.Path("wake.log")
          if wp.exists() and wp.stat().st_size > 0:
              txt = wp.read_text(errors="ignore")
              if "WAKE_INIT_FAILED" not in txt and "WAKE_NO_FINDINGS_OR_EMPTY_OUTPUT" not in txt \
                 and "WAKE_COMPILE_FAILED" not in txt:
                  wake_ok = True
                  wake_high = len(re.findall(r'(?i)(high|critical|severity:\s*high)', txt))

          halmos_fail = halmos_ok = halmos_skipped = False
          halmos_no_tests = False
          hp = pathlib.Path("halmos.log")
          if hp.exists():
              txt = hp.read_text(errors="ignore")
              if "HALMOS_SKIPPED" in txt:
                  halmos_skipped = halmos_ok = True
              elif "HALMOS_NO_TESTS" in txt:
                  halmos_no_tests = True
                  halmos_ok = True
              elif "HALMOS_BUILD_FAILED" in txt or "build failed" in txt.lower():
                  halmos_ok = False
              else:
                  halmos_ok = True
                  halmos_fail = "counterexample" in txt.lower()

          mythril_fail = mythril_ok = False
          mp = pathlib.Path("mythril.log")
          if mp.exists():
              txt = mp.read_text(errors="ignore")
              if "MYTHRIL_NO_SOLC" in txt or "MYTHRIL_SOLC_MISMATCH" in txt \
                 or "Compiler not found" in txt:
                  mythril_ok = False
              else:
                  mythril_ok = True
                  mythril_fail = "SWC-" in txt

          bridgeguard_ok = pathlib.Path("bridgeguard-report.json").exists()
          bridgeguard_high = 0
          if bridgeguard_ok:
              try:
                  txt = pathlib.Path("bridgeguard-report.json").read_text(errors="ignore").lower()
                  bridgeguard_high = txt.count('"severity":"high"') + txt.count('"severity": "high"')
              except Exception:
                  bridgeguard_ok = False

          all_ran = all([slither_ok, semgrep_ok, solast_ok,
                         bridge_semgrep_ok, wake_ok, halmos_ok, mythril_ok])

          total_critical = (slither_high + semgrep_high + solast_high +
                            bridge_high + wake_high + bridgeguard_high +
                            (1 if halmos_fail else 0) + (1 if mythril_fail else 0))
          total_medium = slither_med + semgrep_med + solast_med + bridge_med

          if "BUILD_FAILED" in build:
              verdict = "BUILD-FAILED"
          elif not all_ran:
              verdict = "TOOL-FAILURE"
          elif total_critical > 0:
              verdict = "DEEP-DIVE"
          elif total_medium > 0:
              verdict = "REVIEW-MEDIUM"
          else:
              verdict = "SKIP"

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"## Audit: {os.environ.get('TARGET_REPO','?')} ({project})\n\n")
              f.write(f"**Build gate:** `{build}`\n\n")
              f.write("| Tool | HIGH | MEDIUM | Status |\n|---|---|---|---|\n")
              f.write(f"| Slither | {slither_high} | {slither_med} | {'OK' if slither_ok else 'FAILED'} |\n")
              f.write(f"| Semgrep (security) | {semgrep_high} | {semgrep_med} | {'OK' if semgrep_ok else 'FAILED'} |\n")
              f.write(f"| SolAST (bridge AST) | {solast_high} | {solast_med} | {'OK' if solast_ok else 'FAILED'} |\n")
              f.write(f"| Bridge Semgrep (custom) | {bridge_high} | {bridge_med} | {'OK' if bridge_semgrep_ok else 'FAILED'} |\n")
              f.write(f"| Wake | {wake_high} | — | {'OK' if wake_ok else 'FAILED'} |\n")
              f.write(f"| Halmos | {'YES' if halmos_fail else 'NO'} | — | {'SKIPPED' if halmos_skipped else 'NO-TESTS' if halmos_no_tests else 'OK' if halmos_ok else 'FAILED'} |\n")
              f.write(f"| Mythril | {'YES' if mythril_fail else 'NO'} | — | {'OK' if mythril_ok else 'FAILED'} |\n")
              f.write(f"| BridgeGuard MCP | {bridgeguard_high} | — | {'OK' if bridgeguard_ok else 'OPTIONAL (not run)'} |\n\n")
              f.write(f"**Verdict: `{verdict}`**\n")
              if semgrep_low:
                  f.write(f"\n(Semgrep generic produced {semgrep_low} gas/style findings, excluded.)\n")

          pathlib.Path("verdict.txt").write_text(verdict)
          print(f"VERDICT={verdict}")
          PY
        env:
          TARGET_REPO: ${{ inputs.target_repo }}

      # ================================================================
      # STEP 12 — ARTIFACTS
      # ================================================================
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-${{ github.run_number }}
          path: |
            slither.json
            semgrep.sarif
            solast.sarif
            solast.log
            bridge-semgrep.sarif
            bridge-semgrep.log
            bridgeguard-report.json
            bridgeguard.log
            wake.log
            wake-compile.log
            halmos.log
            mythril.log
            verdict.txt
            build-status.txt
            forge-build.log
            slither.log
            project.txt
            remappings.backup.txt
            bridge-rules.yml
