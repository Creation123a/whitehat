name: Fetch DefiLlama Lending Protocols

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  fetch-protocols:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run DefiLlama Extraction Script
        run: |
          python3 << 'EOF'
          import csv
          import json
          import requests

          # 1. Fetch data from the exact DefiLlama API endpoint
          url = "https://api.llama.fi/protocols"
          response = requests.get(url, timeout=30)
          response.raise_for_status()
          data = response.json()

          # 2. Filter: Lending category, TVL between $50k and $10M,
          #    Arbitrum chain only, and Compound V2 fork only
          min_tvl = 50_000
          max_tvl = 10_000_000

          filtered = []
          for p in data:
              if p.get("category") != "Lending":
                  continue

              tvl = p.get("tvl") or 0
              try:
                  tvl = float(tvl)
              except (TypeError, ValueError):
                  continue

              if not (min_tvl <= tvl <= max_tvl):
                  continue

              chain_list = p.get("chains") or []
              if isinstance(chain_list, str):
                  chain_list = [chain_list]
              chain_names = [str(c) for c in chain_list]

              if "Base" not in chain_names:
                  continue

              forked_ids = p.get("forkedFromIds") or p.get("forkedFrom") or []
              if isinstance(forked_ids, (str, int)):
                  forked_ids = [forked_ids]
              forked_id_strings = [str(x) for x in forked_ids]

              is_compound_v2_fork = "114" in forked_id_strings
              if not is_compound_v2_fork:
                  continue

              slug = p.get("slug") or ""

              filtered.append({
                  "name": p.get("name"),
                  "slug": slug,
                  "tvl_usd": round(tvl, 2),
                  "chains": ", ".join(chain_names),
                  "is_compound_v2_fork": is_compound_v2_fork,
                  "forked_from_ids": ", ".join(forked_id_strings),
                  "url": p.get("url"),
                  "defillama_url": f"https://defillama.com{slug}"
              })

          # Sort highest TVL first
          filtered.sort(key=lambda x: x["tvl_usd"], reverse=True)

          # 3. Save outputs (CSV and JSON)
          with open("lending_protocols.json", "w", encoding="utf-8") as jf:
              json.dump(filtered, jf, indent=2)

          with open("lending_protocols.csv", "w", newline="", encoding="utf-8") as cf:
              if filtered:
                  writer = csv.DictWriter(cf, fieldnames=filtered[0].keys())
                  writer.writeheader()
                  writer.writerows(filtered)

          print(f"Successfully exported {len(filtered)} protocols.")
          EOF

      - name: Upload Results as ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: defillama-lending-results
          path: |
            lending_protocols.csv
            lending_protocols.json
