name: JustLend V1 Dust Market Audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/justlend-audit.yml"

jobs:
  scan-markets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tronpy==0.5.0

      - name: Run JustLend V1 On-Chain Dust Market Audit
        env:
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
        run: |
          python -u - << 'PYEOF'
          import os
          import sys
          from decimal import Decimal, getcontext

          from tronpy import Tron
          from tronpy.providers import HTTPProvider

          getcontext().prec = 50

          UNITROLLER_ADDRESS = "TGjYzgCyPobsNS9n6WcbdLVR9dH7mWqFx7"

          COMPTROLLER_ABI = [
              {
                  "constant": True,
                  "inputs": [],
                  "name": "getAllMarkets",
                  "outputs": [{"name": "", "type": "address[]"}],
                  "type": "function",
              },
              {
                  "constant": True,
                  "inputs": [{"name": "", "type": "address"}],
                  "name": "markets",
                  "outputs": [
                      {"name": "isListed", "type": "bool"},
                      {"name": "collateralFactorMantissa", "type": "uint256"},
                      {"name": "isComped", "type": "bool"},
                  ],
                  "type": "function",
              },
              {
                  "constant": True,
                  "inputs": [{"name": "", "type": "address"}],
                  "name": "mintGuardianPaused",
                  "outputs": [{"name": "", "type": "bool"}],
                  "type": "function",
              },
              {
                  "constant": True,
                  "inputs": [],
                  "name": "oracle",
                  "outputs": [{"name": "", "type": "address"}],
                  "type": "function",
              },
          ]

          JTOKEN_ABI = [
              {"constant": True, "inputs": [], "name": "symbol",
               "outputs": [{"name": "", "type": "string"}], "type": "function"},
              {"constant": True, "inputs": [], "name": "decimals",
               "outputs": [{"name": "", "type": "uint8"}], "type": "function"},
              {"constant": True, "inputs": [], "name": "totalSupply",
               "outputs": [{"name": "", "type": "uint256"}], "type": "function"},
              {"constant": True, "inputs": [], "name": "getCash",
               "outputs": [{"name": "", "type": "uint256"}], "type": "function"},
              {"constant": True, "inputs": [], "name": "exchangeRateStored",
               "outputs": [{"name": "", "type": "uint256"}], "type": "function"},
              {"constant": True, "inputs": [], "name": "underlying",
               "outputs": [{"name": "", "type": "address"}], "type": "function"},
          ]

          ERC20_ABI = [
              {"constant": True, "inputs": [], "name": "symbol",
               "outputs": [{"name": "", "type": "string"}], "type": "function"},
              {"constant": True, "inputs": [], "name": "decimals",
               "outputs": [{"name": "", "type": "uint8"}], "type": "function"},
          ]

          ORACLE_ABI = [
              {"constant": True, "inputs": [{"name": "jToken", "type": "address"}],
               "name": "getUnderlyingPrice",
               "outputs": [{"name": "", "type": "uint256"}], "type": "function"},
          ]


          def safe_call(fn, default=None, label="rpc"):
              """Invoke fn(); swallow exceptions and return default on failure."""
              try:
                  return fn()
              except Exception as exc:
                  print(f"[WARN] {label} failed: {exc}")
                  return default


          def get_working_client() -> Tron:
              """Return the first RPC endpoint that can serve getAllMarkets()."""
              api_key = os.getenv("TRONGRID_API_KEY", "").strip()
              candidates = []
              if api_key:
                  candidates.append((
                      "TronGrid (Auth)",
                      HTTPProvider(endpoint_uri="https://api.trongrid.io", api_key=api_key),
                  ))
              candidates.extend([
                  ("PublicNode",       HTTPProvider(endpoint_uri="https://tron-rpc.publicnode.com")),
                  ("TronGrid (Public)", HTTPProvider(endpoint_uri="https://api.trongrid.io")),
                  ("dRPC",             HTTPProvider(endpoint_uri="https://tron.drpc.org")),
              ])

              last_error = None
              for name, provider in candidates:
                  try:
                      client = Tron(provider=provider)
                      probe = client.get_contract(UNITROLLER_ADDRESS)
                      probe.abi = COMPTROLLER_ABI
                      markets = probe.functions.getAllMarkets()
                      if markets:
                          print(f"Connected to TRON Mainnet via {name} "
                                f"({len(markets)} markets detected).")
                          return client
                  except Exception as exc:
                      last_error = exc
                      print(f"[WARN] RPC {name} unavailable: {exc}")

              raise RuntimeError(
                  f"All TRON Mainnet RPC endpoints failed. Last error: {last_error}"
              )


          def main() -> None:
              print("Initializing TRON Mainnet client...")
              client = get_working_client()          # <-- was get_tron_client() (undefined)

              comptroller = client.get_contract(UNITROLLER_ADDRESS)
              comptroller.abi = COMPTROLLER_ABI

              oracle_addr = comptroller.functions.oracle()
              oracle = client.get_contract(oracle_addr)
              oracle.abi = ORACLE_ABI

              all_markets = comptroller.functions.getAllMarkets()
              print(f"Found {len(all_markets)} markets in JustLend V1 Unitroller.\n")

              results = []

              for m_addr in all_markets:
                  jtoken = client.get_contract(m_addr)
                  jtoken.abi = JTOKEN_ABI

                  # --- core jToken state (must succeed) ---
                  try:
                      j_symbol   = jtoken.functions.symbol()
                      j_decimals = jtoken.functions.decimals()
                      raw_supply = jtoken.functions.totalSupply()
                      raw_cash   = jtoken.functions.getCash()
                      raw_ex     = jtoken.functions.exchangeRateStored()
                  except Exception as exc:
                      print(f"[ERROR] Skipping market {m_addr}: {exc}")
                      continue

                  # --- underlying resolution ---
                  if j_symbol == "jTRX":
                      u_symbol, u_decimals = "TRX", 6
                  else:
                      u_addr = safe_call(jtoken.functions.underlying, None, "underlying")
                      if u_addr:
                          u_contract = client.get_contract(u_addr)
                          u_contract.abi = ERC20_ABI
                          u_symbol   = safe_call(u_contract.functions.symbol,   "UNKNOWN", "underlying.symbol")
                          u_decimals = safe_call(u_contract.functions.decimals, 6,         "underlying.decimals")
                      else:
                          u_symbol, u_decimals = "UNKNOWN", 6

                  # --- market config (safe defaults) ---
                  cf_mantissa   = 0
                  market_info   = safe_call(lambda: comptroller.functions.markets(m_addr),
                                            None, "markets()")
                  if market_info:
                      try:
                          cf_mantissa = int(market_info[1])
                      except Exception:
                          cf_mantissa = 0

                  # Default to True → never false-flag as critical if RPC fails.
                  mint_paused  = bool(safe_call(lambda: comptroller.functions.mintGuardianPaused(m_addr),
                                                True, "mintGuardianPaused()"))
                  oracle_price = int(safe_call(lambda: oracle.functions.getUnderlyingPrice(m_addr),
                                               0, "getUnderlyingPrice()"))

                  cf_pct = (Decimal(cf_mantissa) / Decimal(10**18)) * Decimal(100)

                  scale_exp       = 18 + u_decimals - j_decimals
                  human_ex_rate   = Decimal(raw_ex)     / (Decimal(10) ** scale_exp)
                  human_supply    = Decimal(raw_supply) / (Decimal(10) ** j_decimals)
                  human_cash      = Decimal(raw_cash)   / (Decimal(10) ** u_decimals)

                  is_dust = raw_supply < 100_000
                  is_critical = (
                      is_dust
                      and not mint_paused
                      and cf_mantissa > 0
                      and oracle_price > 0
                  )

                  results.append({
                      "j_symbol":     j_symbol,
                      "u_symbol":     u_symbol,
                      "address":      m_addr,
                      "raw_supply":   raw_supply,
                      "raw_cash":     raw_cash,
                      "human_supply": human_supply,
                      "human_cash":   human_cash,
                      "human_ex_rate": human_ex_rate,
                      "cf_pct":       cf_pct,
                      "mint_paused":  mint_paused,
                      "oracle_price": oracle_price,
                      "is_dust":      is_dust,
                      "is_critical":  is_critical,
                  })

              results.sort(key=lambda x: x["raw_supply"])

              header = (
                  f"{'SYMBOL':<10} | {'UNDERLYING':<10} | {'RAW_SUPPLY':<16} | "
                  f"{'RAW_CASH':<20} | {'EXCH_RATE':<14} | {'CF%':<6} | "
                  f"{'PAUSED':<6} | {'STATUS'}"
              )
              print(header)
              print("-" * len(header))

              for r in results:
                  if   r["is_critical"]: status = "CRITICAL_DUST"
                  elif r["is_dust"]:     status = "DUST (MITIGATED)"
                  else:                  status = "NORMAL"

                  print(
                      f"{r['j_symbol']:<10} | {r['u_symbol']:<10} | {r['raw_supply']:<16} | "
                      f"{r['raw_cash']:<20} | {r['human_ex_rate']:<14.6f} | {r['cf_pct']:<6.1f} | "
                      f"{str(r['mint_paused']):<6} | {status}"
                  )

              print("\n--- DETAILED ADDRESS & ORACLE DUMP FOR DUST MARKETS ---")
              dust_markets = [r for r in results if r["is_dust"]]
              if not dust_markets:
                  print("No dust markets found below threshold.")
              else:
                  for d in dust_markets:
                      print(
                          f"Market: {d['j_symbol']} ({d['address']}) | "
                          f"Underlying: {d['u_symbol']} | "
                          f"Raw Supply: {d['raw_supply']} ({d['human_supply']}) | "
                          f"Raw Cash: {d['raw_cash']} ({d['human_cash']}) | "
                          f"Oracle Price: {d['oracle_price']} | "
                          f"Mint Paused: {d['mint_paused']}"
                      )


          if __name__ == "__main__":
              try:
                  main()
              except Exception as exc:
                  print("Fatal execution error:", exc, file=sys.stderr)
                  sys.exit(1)
          PYEOF
