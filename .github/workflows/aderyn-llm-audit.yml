name: Slither + LLM Map-Reduce Audit
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "current_repo or external_github_repo"
        required: false
        default: "current_repo"
        type: choice
        options: [current_repo, external_github_repo]
      external_repo_url:
        description: "External repo URL if mode=external_github_repo"
        required: false
        default: ""
        type: string
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Auditor Repo
        uses: actions/checkout@v4
        with:
          path: auditor
          submodules: recursive
          fetch-depth: 1
      - name: Setup Target Workspace
        env:
          MODE: ${{ inputs.mode }}
          EXTERNAL_REPO_URL: ${{ inputs.external_repo_url }}
        run: |
          set -euo pipefail
          mkdir -p target
          if [ "$MODE" = "external_github_repo" ]; then
            git clone --depth 1 --recurse-submodules "$EXTERNAL_REPO_URL" target
            rm -rf target/.git
          else
            cp -a auditor/. target/
            rm -rf target/.git
          fi
          ls -la target/ | head -20
          ls -la target/lib/ || echo "no lib folder yet"
      - name: Install Foundry + Slither
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install Python Deps
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          pip3 install slither-analyzer solc-select openai
          solc-select install 0.8.20 || true
          solc-select use 0.8.20 || true
          forge --version
          slither --version || true
      - name: Install Foundry Dependencies in Target
        working-directory: target
        run: |
          set -euo pipefail
          forge install --no-commit || true
          if [ ! -d "lib/forge-std" ]; then forge install --no-commit foundry-rs/forge-std || true; fi
          if [ ! -d "lib/openzeppelin-contracts" ]; then forge install --no-commit OpenZeppelin/openzeppelin-contracts@v5.0.2 || true; fi
          if [ ! -d "lib/openzeppelin-contracts-upgradeable" ]; then forge install --no-commit OpenZeppelin/openzeppelin-contracts-upgradeable@v5.0.2 || true; fi
          if [ ! -d "lib/solmate" ]; then forge install --no-commit transmissions11/solmate || true; fi
          ls -la lib/ || echo "lib still empty"
      - name: Copy Audit Script Into Target
        run: |
          set -euo pipefail
          cp auditor/.github/scripts/audit_pipeline.py target/audit_pipeline.py
          python3 -c "import ast; ast.parse(open('target/audit_pipeline.py').read()); print('py OK')"
      - name: Run Slither + LLM Audit
        working-directory: target
        env:
          CF_ACCOUNT_ID_1: ${{ secrets.CF_ACCOUNT_ID_1 }}
          CF_API_TOKEN_1: ${{ secrets.CF_API_TOKEN_1 }}
          CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID_2 }}
          CF_API_TOKEN_2: ${{ secrets.CF_API_TOKEN_2 }}
          CF_ACCOUNT_ID_3: ${{ secrets.CF_ACCOUNT_ID_3 }}
          CF_API_TOKEN_3: ${{ secrets.CF_API_TOKEN_3 }}
          GONKA_KEY_1: ${{ secrets.GONKA_KEY_1 }}
          GONKA_KEY_2: ${{ secrets.GONKA_KEY_2 }}
          GONKA_KEY_3: ${{ secrets.GONKA_KEY_3 }}
          GONKA_BASE_URL: ${{ secrets.GONKA_BASE_URL }}
        run: |
          set -euo pipefail
          python3 -u audit_pipeline.py
      - name: Upload Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: target/audit-report.md
          if-no-files-found: warn
