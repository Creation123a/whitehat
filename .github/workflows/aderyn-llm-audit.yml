name: Audit Any Repo - Paste Name, It Clones + Audits
on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Paste repo like: Morpho-Organization/morpho-blue"
        required: true
        default: "Creation123a/whitehat"
      target_branch:
        description: "Branch"
        required: false
        default: "main"

permissions:
  contents: read
  security-events: write

jobs:
  audit-any:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # 1. CLONE - FIXED: token fallback + submodules
      - name: Clone target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ inputs.target_branch }}
          path: target
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 1
          submodules: recursive

      # FIXED: Pin Python 3.11 - Mythril breaks on 3.14 (coincurve)
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: foundry-rs/foundry-toolchain@v1

      # FIXED: Install deps before Halmos/Slither or they fail with "No such file"
      - name: Install dependencies
        working-directory: target
        run: |
          forge install --no-commit || true
          forge build || true

      # 2. STATIC - Slither
      - name: Slither
        working-directory: target
        continue-on-error: true
        run: |
          pip install slither-analyzer || true
          slither . --json ../slither.json || true

      # 3. STATIC - Semgrep - FIXED: p/solidity 404, use auto only
      - name: Semgrep
        working-directory: target
        continue-on-error: true
        run: |
          pip install semgrep || true
          semgrep --config auto --sarif --output ../semgrep.sarif . || true

      # 4. STATIC - Wake
      - name: Wake Detect
        working-directory: target
        continue-on-error: true
        run: |
          pip install eth-wake || true
          wake detect all --output ../wake-report.json || true

      # 5. SYMBOLIC - Halmos - FIXED: deps installed above, log captured
      - name: Halmos Symbolic
        working-directory: target
        continue-on-error: true
        run: |
          pip install halmos || true
          halmos --function check_ --loop 5 > ../halmos.log 2>&1 || true
          cat ../halmos.log || true

      # 6. SYMBOLIC - Mythril - FIXED: Python 3.11 + never fails job + docker fallback
      - name: Mythril Critical Files Only
        working-directory: target
        continue-on-error: true
        run: |
          pip install mythril || pip install "mythril==0.24.8" || echo "Mythril pip failed, trying docker"
          : > ../mythril.log
          for f in $(find src contracts -name "*.sol" 2>/dev/null | head -2); do
            echo "=== Mythril $f ===" >> ../mythril.log
            if command -v myth >/dev/null 2>&1; then
              timeout 300 myth analyze "$f" --execution-timeout 280 --max-depth 30 >> ../mythril.log 2>&1 || true
            else
              timeout 300 docker run --rm -v "$PWD:/tmp" mythril/myth analyze "/tmp/$f" --execution-timeout 280 --max-depth 30 >> ../mythril.log 2>&1 || true
            fi
          done
          cat ../mythril.log || true

      # 7. AUTO-TRIAGE
      - name: Auto-Triage
        run: |
          python3 - << 'PY'
          import json, os, re
          slither_high = slither_med = 0
          semgrep_high = semgrep_med = 0
          wake_high = 0
          halmos_fail = False
          mythril_high = False
          if os.path.exists("slither.json"):
              try:
                  d = json.load(open("slither.json"))
                  dets = d.get("results", {}).get("detectors", []) if isinstance(d, dict) else []
                  if not dets and isinstance(d, dict):
                      dets = d.get("detectors", [])
                  for x in dets:
                      imp = str(x.get("impact", "")).lower()
                      if imp == "high":
                          slither_high += 1
                      elif imp == "medium":
                          slither_med += 1
              except Exception as e:
                  print(f"Slither parse error: {e}")
          if os.path.exists("semgrep.sarif"):
              try:
                  d = json.load(open("semgrep.sarif"))
                  for run in d.get("runs", []):
                      for r in run.get("results", []):
                          lvl = str(r.get("level", "")).lower()
                          if lvl == "error":
                              semgrep_high += 1
                          elif lvl == "warning":
                              semgrep_med += 1
              except Exception as e:
                  print(f"Semgrep parse error: {e}")
          if os.path.exists("wake-report.json"):
              try:
                  txt = open("wake-report.json", errors="ignore").read()
                  try:
                      d = json.loads(txt)
                      s = json.dumps(d).lower()
                  except:
                      s = txt.lower()
                  wake_high = len(re.findall(r'"severity"\s*:\s*"high"', s)) + len(re.findall(r'"impact"\s*:\s*"high"', s))
                  if wake_high == 0:
                      wake_high = s.count('"high"') // 3 if s.count('"high"') >= 3 else 0
              except Exception as e:
                  print(f"Wake parse error: {e}")
          if os.path.exists("halmos.log"):
              txt = open("halmos.log", errors="ignore").read().lower()
              if "counterexample" in txt:
                  halmos_fail = True
          if os.path.exists("mythril.log"):
              txt = open("mythril.log", errors="ignore").read()
              if "SWC-" in txt:
                  mythril_high = True
          total_critical = slither_high + semgrep_high + wake_high + (1 if halmos_fail else 0) + (1 if mythril_high else 0)
          total_medium = slither_med + semgrep_med
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"## Audit Result for {os.environ.get('TARGET_REPO', 'unknown')}\n\n")
              f.write(f"| Tool | HIGH / CRITICAL | MEDIUM |\n")
              f.write(f"| --- | --- | --- |\n")
              f.write(f"| Slither | {slither_high} | {slither_med} |\n")
              f.write(f"| Semgrep | {semgrep_high} | {semgrep_med} |\n")
              f.write(f"| Wake | {wake_high} | - |\n")
              f.write(f"| Halmos Counterexample | {'YES' if halmos_fail else 'NO'} | - |\n")
              f.write(f"| Mythril Issue | {'YES' if mythril_high else 'NO'} | - |\n")
              f.write(f"\n")
              if total_critical > 0:
                  f.write(f"## 🔴 DEEP-DIVE - {total_critical} Critical signals\n\n")
                  f.write(f"Open the artifact, check the files flagged above. Do NOT skip.\n")
              elif total_medium > 0:
                  f.write(f"## 🟡 REVIEW MEDIUM - {total_medium} Medium signals, no Critical\n\n")
                  f.write(f"Quick skim only, 10 min max. If Mediums look like false positives, skip.\n")
              else:
                  f.write(f"## 🟢 SKIP - 0 Critical, 0 Medium\n\n")
                  f.write(f"Move to next protocol. Do not deep-dive.\n")
          print(f"VERDICT={'DEEP-DIVE' if total_critical>0 else 'REVIEW-MEDIUM' if total_medium>0 else 'SKIP'}")
          open("verdict.txt","w").write("DEEP-DIVE" if total_critical>0 else "REVIEW-MEDIUM" if total_medium>0 else "SKIP")
          PY
        env:
          TARGET_REPO: ${{ inputs.target_repo }}

      - name: Upload All Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-${{ github.run_number }}
          path: |
            slither.json
            semgrep.sarif
            wake-report.json
            halmos.log
            mythril.log
            verdict.txt
