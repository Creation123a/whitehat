name: Audit Any Repo

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Repo (owner/name)"
        required: true
      target_branch:
        description: "Branch"
        required: false
        default: main

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_REPO: ${{ inputs.target_repo }}
    steps:
      - name: Clone target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ inputs.target_branch }}
          path: target
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 1
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # FIX 1: Node 22, not 20. Hardhat 3 requires >= 22.13.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: foundry-rs/foundry-toolchain@v1

      # ================================================================
      # STEP 1 — DETECT, INSTALL, BUILD
      # ================================================================
      - name: Detect project, install dependencies, build
        working-directory: target
        run: |
          set -euo pipefail

          # FIX 1: Foundry wins. Hardhat only if NO foundry.toml.
          PROJECT="plain"
          if [ -f foundry.toml ]; then
            PROJECT="foundry"
          elif [ -f hardhat.config.js ] || [ -f hardhat.config.ts ]; then
            PROJECT="hardhat"
          elif [ -f truffle-config.js ]; then
            PROJECT="truffle"
          fi
          echo "PROJECT=$PROJECT" | tee ../project.txt

          # FIX 2: NEVER overwrite remappings.txt. Backup if it exists.
          if [ -f remappings.txt ]; then
            cp remappings.txt ../remappings.backup.txt
            echo "Backed up existing remappings.txt"
          fi

          if [ "$PROJECT" = "foundry" ]; then
            # FIX 4: Soldeer must run BEFORE forge build.
            # --config-location foundry prevents CI interactive prompt.
            if grep -q '^\[dependencies\]' foundry.toml 2>/dev/null; then
              echo "Soldeer detected — installing dependencies"
              forge soldeer install --config-location foundry || {
                echo "FATAL: forge soldeer install failed" >&2
                exit 1
              }
              # FAIL FAST if dependencies/ is empty after install.
              if [ -d dependencies ] && [ -z "$(ls -A dependencies 2>/dev/null)" ] && [ ! -d lib ]; then
                echo "FATAL: dependencies/ is empty after soldeer install" >&2
                exit 1
              fi
            fi

            # Git submodule deps (lib/)
            forge install --no-commit || true

            forge clean || true
            forge build --force 2>&1 | tee ../forge-build.log
            # Forge build must succeed for downstream tools.
            if [ ! -d out ] && [ ! -d cache ]; then
              echo "FATAL: forge build produced no artifacts" >&2
              exit 1
            fi

            # FIX 2: Only generate remappings if repo has none.
            if [ ! -s remappings.txt ]; then
              forge remappings > remappings.txt 2>/dev/null || true
            fi
            echo "=== remappings.txt ==="
            cat remappings.txt || echo "(none)"

            # Verify every remapping target exists on disk.
            python3 - << 'PY'
          import pathlib
          p = pathlib.Path("remappings.txt")
          if not p.exists():
              print("No remappings.txt — skipping verification")
              raise SystemExit(0)
          missing = 0
          for line in p.read_text().splitlines():
              line = line.strip()
              if not line or "=" not in line:
                  continue
              # Contextual remapping: dep:prefix=target
              if ":" in line and "=" in line:
                  _, rest = line.split(":", 1)
                  if "=" in rest:
                      line = rest
              prefix, target = line.split("=", 1)
              target = target.strip()
              if not pathlib.Path(target).exists():
                  print(f"MISSING remapping target: {line}")
                  missing += 1
          if missing:
              print(f"FATAL: {missing} remapping target(s) missing")
              raise SystemExit(1)
          print("All remapping targets exist")
          PY

          elif [ "$PROJECT" = "hardhat" ] || [ "$PROJECT" = "truffle" ]; then
            # FIX 1: Use project's own Hardhat, never bare npx hardhat.
            if [ -f pnpm-lock.yaml ]; then
              corepack enable && pnpm install
            elif [ -f yarn.lock ]; then
              yarn install
            else
              npm ci || npm install
            fi
            ./node_modules/.bin/hardhat compile 2>&1 | tee ../forge-build.log
            # Hardhat 3 reads remappings.txt automatically. Do not fake it.

          elif [ -f package.json ]; then
            npm ci || npm install
          fi

          echo "=== .sol files (top-level) ==="
          find . -name "*.sol" \
            -not -path "*/node_modules/*" \
            -not -path "*/dependencies/*" \
            -not -path "*/lib/*" \
            | head -30

      # ================================================================
      # STEP 2 — WAKE CONFIGURATION (FIX 3: CORRECT NAMESPACE)
      # ================================================================
      - name: Prepare Wake configuration
        working-directory: target
        continue-on-error: true
        run: |
          set -euo pipefail
          PROJECT=$(cut -d= -f2 ../project.txt)

          # Wake's documented remapping key is compiler.solc.remappings,
          # NOT compiler.remappings. Source: ackee.xyz/wake/docs/configuration
          if [ "$PROJECT" = "foundry" ] && [ -s remappings.txt ]; then
            echo "Writing wake.toml with compiler.solc.remappings"
            {
              echo "[compiler.solc]"
              echo "remappings = ["
              while IFS= read -r line; do
                line=$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
                [ -z "$line" ] && continue
                # Skip contextual remappings for Wake (keep it simple, solc-compatible).
                case "$line" in
                  *:*) continue ;;
                esac
                printf '  "%s",\n' "$line"
              done < remappings.txt
              echo "]"
            } > wake.toml
            echo "=== wake.toml ==="
            cat wake.toml
          elif [ -f wake.toml ]; then
            echo "Repo already has wake.toml — leaving untouched"
          else
            echo "No remappings.txt and no wake.toml — Wake will use defaults"
          fi

      # ================================================================
      # STEP 3 — SLITHER
      # ================================================================
      - name: Slither
        working-directory: target
        continue-on-error: true
        run: |
          python3 -m venv /tmp/venv-slither
          /tmp/venv-slither/bin/pip install -q slither-analyzer
          /tmp/venv-slither/bin/slither . \
            --exclude-dependencies \
            --json ../slither.json \
            2>&1 | tee ../slither.log
          if [ ! -s ../slither.json ]; then
            echo "FATAL: slither.json is empty or missing" | tee -a ../slither.log
            exit 1
          fi

      # ================================================================
      # STEP 4 — SEMGREP
      # ================================================================
      - name: Semgrep
        working-directory: target
        continue-on-error: true
        run: |
          python3 -m venv /tmp/venv-semgrep
          /tmp/venv-semgrep/bin/pip install -q semgrep
          SOL_DIRS=$(find . -maxdepth 2 -type d \( -name src -o -name contracts \) \
            -not -path "*/node_modules/*" -not -path "*/lib/*" \
            -not -path "*/dependencies/*" | tr '\n' ' ')
          [ -z "$SOL_DIRS" ] && SOL_DIRS="."
          /tmp/venv-semgrep/bin/semgrep \
            --config p/smart-contracts \
            --include="*.sol" \
            --sarif --output ../semgrep.sarif \
            $SOL_DIRS || true
          if [ ! -s ../semgrep.sarif ]; then
            echo "FATAL: semgrep.sarif is empty or missing" | tee -a ../semgrep.log
            exit 1
          fi

      # ================================================================
      # STEP 5 — WAKE DETECT (uses wake.toml from Step 2)
      # ================================================================
      - name: Wake Detect
        working-directory: target
        continue-on-error: true
        run: |
          python3 -m venv /tmp/venv-wake
          /tmp/venv-wake/bin/pip install -q eth-wake
          /tmp/venv-wake/bin/wake detect all \
            --output ../wake-report.json \
            2>&1 | tee ../wake.log
          if [ ! -s ../wake-report.json ]; then
            echo "FATAL: wake-report.json is empty or missing" | tee -a ../wake.log
            exit 1
          fi

      # ================================================================
      # STEP 6 — HALMOS (Foundry only)
      # ================================================================
      - name: Halmos
        working-directory: target
        continue-on-error: true
        run: |
          PROJECT=$(cut -d= -f2 ../project.txt)
          if [ "$PROJECT" != "foundry" ]; then
            echo "HALMOS_SKIPPED — not a Foundry project" > ../halmos.log
            exit 0
          fi
          python3 -m venv /tmp/venv-halmos
          /tmp/venv-halmos/bin/pip install -q halmos
          /tmp/venv-halmos/bin/halmos --function check_ --loop 5 \
            > ../halmos.log 2>&1 || true
          if grep -qi "Build failed\|Compiler run failed" ../halmos.log; then
            echo "HALMOS_BUILD_FAILED" >> ../halmos.log
          fi

      # ================================================================
      # STEP 7 — MYTHRIL (FIX 5: reuse Foundry's solc, pass --solc-json)
      # ================================================================
      - name: Mythril
        working-directory: target
        continue-on-error: true
        run: |
          : > ../mythril.log

          # FIX 5: reuse Foundry's solc from ~/.svm, do not download via py-solc-x.
          SOLC_BIN=$(find ~/.svm -name solc -type f 2>/dev/null | head -1)
          echo "Foundry solc: ${SOLC_BIN:-NOT FOUND}" | tee -a ../mythril.log
          if [ -z "$SOLC_BIN" ] || [ ! -x "$SOLC_BIN" ]; then
            echo "MYTHRIL_NO_SOLC — forge build did not provide a solc binary" >> ../mythril.log
            exit 1
          fi
          cp "$SOLC_BIN" /tmp/solc && chmod +x /tmp/solc
          /tmp/solc --version | tee -a ../mythril.log

          # Mythril accepts remappings via --solc-json, not --solc-args.
          # Build a mythril.json from the repo's real remappings.txt.
          if [ -s remappings.txt ]; then
            python3 - << 'PY'
          import json, pathlib
          remaps = []
          p = pathlib.Path("remappings.txt")
          for line in p.read_text().splitlines():
              line = line.strip()
              if not line or "=" not in line:
                  continue
              case = line.split(":", 1) if ":" in line and "=" in line.split(":", 1)[1] else None
              if case:
                  dep, rest = case
                  if "=" in rest:
                      prefix, target = rest.split("=", 1)
                      remaps.append(f"{dep}:{prefix}={target}")
              else:
                  prefix, target = line.split("=", 1)
                  remaps.append(f"{prefix}={target}")
          json.dump({"remappings": remaps}, open("mythril.json", "w"), indent=2)
          print(f"Wrote mythril.json with {len(remaps)} remappings")
          PY
            SOLC_JSON="--solc-json mythril.json"
          else
            SOLC_JSON=""
          fi

          python3 -m venv /tmp/venv-mythril
          /tmp/venv-mythril/bin/pip install -q mythril

          # Top 2 source files only (Mythril is slow).
          FILES=$(find src contracts . -maxdepth 3 -name "*.sol" 2>/dev/null \
            | grep -v node_modules \
            | grep -v "/lib/" \
            | grep -v "/dependencies/" \
            | grep -v "/test/" \
            | grep -v "/script/" \
            | head -2)

          if [ -z "$FILES" ]; then
            echo "No source files found for Mythril" >> ../mythril.log
            exit 1
          fi

          for f in $FILES; do
            echo "=== Mythril $f ===" >> ../mythril.log
            PATH="/tmp:$PATH" SOLC=/tmp/solc \
              timeout 300 /tmp/venv-mythril/bin/myth analyze "$f" \
                $SOLC_JSON \
                --execution-timeout 280 \
                --max-depth 30 \
                >> ../mythril.log 2>&1 || true
          done
          cat ../mythril.log

      # ================================================================
      # STEP 8 — AUTO-TRIAGE
      # ================================================================
      - name: Auto-Triage
        run: |
          python3 - << 'PY'
          import json, os, re, pathlib

          project = pathlib.Path("project.txt").read_text().strip().split("=")[1] if pathlib.Path("project.txt").exists() else "unknown"

          # --- Slither ---
          slither_high = slither_med = 0
          slither_ok = False
          sp = pathlib.Path("slither.json")
          if sp.exists() and sp.stat().st_size > 0:
              try:
                  d = json.loads(sp.read_text())
                  slither_ok = True
                  for x in d.get("results", {}).get("detectors", []):
                      imp = str(x.get("impact", "")).lower()
                      if imp == "high": slither_high += 1
                      elif imp == "medium": slither_med += 1
              except Exception:
                  slither_ok = False

          # --- Semgrep (FIX 6: count only solidity.security.* rules) ---
          semgrep_high = semgrep_med = semgrep_low = 0
          semgrep_ok = False
          gp = pathlib.Path("semgrep.sarif")
          if gp.exists() and gp.stat().st_size > 0:
              try:
                  d = json.loads(gp.read_text())
                  semgrep_ok = True
                  for run in d.get("runs", []):
                      for r in run.get("results", []):
                          rid = str(r.get("ruleId", ""))
                          if "solidity.security." in rid:
                              semgrep_high += 1
                          elif "solidity.performance." in rid or "solidity.best-practice." in rid:
                              semgrep_low += 1
                          else:
                              semgrep_med += 1
              except Exception:
                  semgrep_ok = False

          # --- Wake ---
          wake_high = 0
          wake_ok = False
          wp = pathlib.Path("wake-report.json")
          if wp.exists() and wp.stat().st_size > 0:
              try:
                  txt = wp.read_text(errors="ignore").lower()
                  wake_ok = "parsererror" not in txt and "not found" not in txt
                  wake_high = len(re.findall(r'"severity"\s*:\s*"high"', txt)) + \
                              len(re.findall(r'"impact"\s*:\s*"high"', txt))
              except Exception:
                  wake_ok = False

          # --- Halmos ---
          halmos_fail = False
          halmos_ok = False
          halmos_skipped = False
          hp = pathlib.Path("halmos.log")
          if hp.exists():
              txt = hp.read_text(errors="ignore")
              if "HALMOS_SKIPPED" in txt:
                  halmos_skipped = True
                  halmos_ok = True  # intentionally skipped is OK
              elif "HALMOS_BUILD_FAILED" in txt or "build failed" in txt.lower():
                  halmos_ok = False
              else:
                  halmos_ok = True
                  if "counterexample" in txt.lower():
                      halmos_fail = True

          # --- Mythril ---
          mythril_fail = False
          mythril_ok = False
          mp = pathlib.Path("mythril.log")
          if mp.exists():
              txt = mp.read_text(errors="ignore")
              if "MYTHRIL_NO_SOLC" in txt or "Compiler not found" in txt:
                  mythril_ok = False
              else:
                  mythril_ok = True
                  if "SWC-" in txt:
                      mythril_fail = True

          all_ran = all([slither_ok, semgrep_ok, wake_ok, halmos_ok, mythril_ok])

          total_critical = slither_high + semgrep_high + wake_high + \
                           (1 if halmos_fail else 0) + (1 if mythril_fail else 0)
          total_medium = slither_med + semgrep_med

          if not all_ran:
              verdict = "UNKNOWN"
          elif total_critical > 0:
              verdict = "DEEP-DIVE"
          elif total_medium > 0:
              verdict = "REVIEW-MEDIUM"
          else:
              verdict = "SKIP"

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"## Audit: {os.environ.get('TARGET_REPO', '?')} ({project})\n\n")
              f.write("| Tool | HIGH | MEDIUM | Status |\n|---|---|---|---|\n")
              f.write(f"| Slither | {slither_high} | {slither_med} | {'OK' if slither_ok else 'FAILED'} |\n")
              f.write(f"| Semgrep (security) | {semgrep_high} | {semgrep_med} | {'OK' if semgrep_ok else 'FAILED'} |\n")
              f.write(f"| Wake | {wake_high} | — | {'OK' if wake_ok else 'FAILED'} |\n")
              f.write(f"| Halmos | {'YES' if halmos_fail else 'NO'} | — | {'SKIPPED' if halmos_skipped else 'OK' if halmos_ok else 'FAILED'} |\n")
              f.write(f"| Mythril | {'YES' if mythril_fail else 'NO'} | — | {'OK' if mythril_ok else 'FAILED'} |\n\n")
              f.write(f"**Verdict: `{verdict}`**\n")
              if semgrep_low:
                  f.write(f"\n(Semgrep also produced {semgrep_low} gas/style findings, excluded from verdict.)\n")

          pathlib.Path("verdict.txt").write_text(verdict)
          print(f"VERDICT={verdict}")
          PY
        env:
          TARGET_REPO: ${{ inputs.target_repo }}

      # ================================================================
      # STEP 9 — ARTIFACTS
      # ================================================================
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-${{ github.run_number }}
          path: |
            slither.json
            semgrep.sarif
            wake-report.json
            halmos.log
            mythril.log
            verdict.txt
            forge-build.log
            slither.log
            wake.log
            project.txt
            remappings.backup.txt
