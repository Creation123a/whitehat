name: Audit Any Repo — Bridge-Aware

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Repo (owner/name)"
        required: true
      target_branch:
        description: "Branch"
        required: false
        default: main

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_REPO: ${{ inputs.target_repo }}
    steps:
      - name: Clone target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ inputs.target_branch }}
          path: target
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 1
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Node 22 — Hardhat 3 requires >= 22.13; SolAST requires >= 18.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: foundry-rs/foundry-toolchain@v1

      # ================================================================
      # STEP 1 — DETECT, INSTALL, BUILD
      # ================================================================
      - name: Detect project, install dependencies, build
        working-directory: target
        run: |
          set -euo pipefail

          # Foundry wins. Hardhat only if there is NO foundry.toml.
          PROJECT="plain"
          if [ -f foundry.toml ]; then
            PROJECT="foundry"
          elif [ -f hardhat.config.js ] || [ -f hardhat.config.ts ]; then
            PROJECT="hardhat"
          elif [ -f truffle-config.js ]; then
            PROJECT="truffle"
          fi
          echo "PROJECT=$PROJECT" | tee ../project.txt

          # NEVER overwrite remappings.txt. Backup if it exists.
          if [ -f remappings.txt ]; then
            cp remappings.txt ../remappings.backup.txt
            echo "Backed up existing remappings.txt"
          fi

          if [ "$PROJECT" = "foundry" ]; then
            # Soldeer must run BEFORE forge build.
            if grep -q '^\[dependencies\]' foundry.toml 2>/dev/null; then
              echo "Soldeer detected — installing dependencies"
              forge soldeer install --config-location foundry || {
                echo "FATAL: forge soldeer install failed" >&2
                exit 1
              }
              if [ -d dependencies ] && [ -z "$(ls -A dependencies 2>/dev/null)" ] && [ ! -d lib ]; then
                echo "FATAL: dependencies/ is empty after soldeer install" >&2
                exit 1
              fi
            fi

            forge install --no-commit || true
            forge clean || true
            forge build --force 2>&1 | tee ../forge-build.log

            # Only generate remappings if repo has none.
            if [ ! -s remappings.txt ]; then
              forge remappings > remappings.txt 2>/dev/null || true
            fi
            echo "=== remappings.txt ==="
            cat remappings.txt || echo "(none)"

            # Verify every remapping target exists.
            python3 - << 'PY'
          import pathlib
          p = pathlib.Path("remappings.txt")
          if not p.exists():
              print("No remappings.txt — skipping verification")
              raise SystemExit(0)
          missing = 0
          for line in p.read_text().splitlines():
              line = line.strip()
              if not line or "=" not in line:
                  continue
              if ":" in line and "=" in line:
                  _, rest = line.split(":", 1)
                  if "=" in rest:
                      line = rest
              prefix, target = line.split("=", 1)
              target = target.strip()
              if not pathlib.Path(target).exists():
                  print(f"MISSING remapping target: {line}")
                  missing += 1
          if missing:
              print(f"FATAL: {missing} remapping target(s) missing")
              raise SystemExit(1)
          print("All remapping targets exist")
          PY

          elif [ "$PROJECT" = "hardhat" ] || [ "$PROJECT" = "truffle" ]; then
            if [ -f pnpm-lock.yaml ]; then
              corepack enable && pnpm install
            elif [ -f yarn.lock ]; then
              yarn install
            else
              npm ci || npm install
            fi
            ./node_modules/.bin/hardhat compile 2>&1 | tee ../forge-build.log

          elif [ -f package.json ]; then
            npm ci || npm install
          fi

          # FIX: broken pipe. Write to file, then slice — no `find | head`.
          find . -name "*.sol" \
            -not -path "*/node_modules/*" \
            -not -path "*/dependencies/*" \
            -not -path "*/lib/*" \
            -not -path "*/out/*" \
            -not -path "*/cache/*" \
            -not -path "*/broadcast/*" \
            -not -path "*/artifacts/*" \
            > ../sol-files.txt 2>/dev/null || true
          echo "=== .sol files (top-level) ==="
          head -30 ../sol-files.txt || true

      # ================================================================
      # STEP 2 — WAKE CONFIGURATION (correct namespace)
      # ================================================================
      - name: Prepare Wake configuration
        working-directory: target
        continue-on-error: true
        run: |
          set -euo pipefail
          PROJECT=$(cut -d= -f2 ../project.txt)

          # Wake's documented remapping key is compiler.solc.remappings,
          # NOT compiler.remappings / compiler.allow_paths.
          if [ "$PROJECT" = "foundry" ] && [ -s remappings.txt ]; then
            echo "Writing wake.toml with compiler.solc.remappings"
            {
              echo "[compiler.solc]"
              echo "remappings = ["
              while IFS= read -r line; do
                line=$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
                [ -z "$line" ] && continue
                case "$line" in *:*) continue ;; esac   # skip contextual for Wake
                printf '  "%s",\n' "$line"
              done < remappings.txt
              echo "]"
            } > wake.toml
            cat wake.toml
          elif [ -f wake.toml ]; then
            echo "Repo already has wake.toml — leaving untouched"
          else
            echo "No remappings.txt and no wake.toml — Wake will use defaults"
          fi

      # ================================================================
      # STEP 3 — SLITHER
      # ================================================================
      - name: Slither
        working-directory: target
        continue-on-error: true
        run: |
          python3 -m venv /tmp/venv-slither
          /tmp/venv-slither/bin/pip install -q slither-analyzer
          /tmp/venv-slither/bin/slither . --exclude-dependencies \
            --json ../slither.json 2>&1 | tee ../slither.log
          [ -s ../slither.json ] || { echo "FATAL: slither.json empty" >&2; exit 1; }

      # ================================================================
      # STEP 4 — SEMGREP (generic smart-contracts ruleset)
      # ================================================================
      - name: Semgrep — generic
        working-directory: target
        continue-on-error: true
        run: |
          python3 -m venv /tmp/venv-semgrep
          /tmp/venv-semgrep/bin/pip install -q semgrep
          SOL_DIRS=$(find . -maxdepth 2 -type d \( -name src -o -name contracts \) \
            -not -path "*/node_modules/*" -not -path "*/lib/*" \
            -not -path "*/dependencies/*" -not -path "*/out/*" | tr '\n' ' ')
          [ -z "$SOL_DIRS" ] && SOL_DIRS="."
          /tmp/venv-semgrep/bin/semgrep --config p/smart-contracts \
            --include="*.sol" --sarif --output ../semgrep.sarif $SOL_DIRS || true
          [ -s ../semgrep.sarif ] || { echo "FATAL: semgrep.sarif empty" >&2; exit 1; }

      # ================================================================
      # STEP 5 — SOLAST (bridge-specific AST detectors, no solc needed)
      # ================================================================
      - name: SolAST — bridge-specific AST scan
        working-directory: target
        continue-on-error: true
        run: |
          # SolAST parses raw .sol files; no solc, no remappings, no build.
          # Bridge detectors: message replay, forged proofs, missing nonces,
          # calldata truncation.
          SOLAST_TARGETS=""
          for d in src contracts; do [ -d "$d" ] && SOLAST_TARGETS="$SOLAST_TARGETS $d"; done
          [ -z "$SOLAST_TARGETS" ] && SOLAST_TARGETS="."
          npx --yes @snovon/solast scan --format sarif --dedup $SOLAST_TARGETS \
            > ../solast.sarif 2> ../solast.log || true
          if [ ! -s ../solast.sarif ]; then
            echo "SOLAST_EMPTY_OR_FAILED" | tee -a ../solast.log
            exit 1
          fi
          echo "SolAST SARIF written: $(wc -c < ../solast.sarif) bytes"
          python3 - << 'PY'
          import json
          try:
              d = json.load(open("../solast.sarif"))
              n = sum(len(r.get("results", [])) for r in d.get("runs", []))
              print(f"SolAST findings: {n}")
          except Exception as e:
              print(f"SolAST parse warning: {e}")
          PY

      # ================================================================
      # STEP 6 — SKILLSAUTH CROSS-CHAIN BRIDGE SEMGREP RULES
      # ================================================================
      - name: Semgrep — SkillsAuth cross-chain bridge rules
        working-directory: target
        continue-on-error: true
        run: |
          set -euo pipefail
          # Install the verified bridge skill. Non-fatal if the registry is
          # unreachable; the triage will mark bridge-semgrep as not-run.
          npx --yes skillsauth add apegurus/solidity-argus cross-chain-bridge-vulnerabilities \
            > ../skillsauth-install.log 2>&1 || {
              echo "SKILLSAUTH_INSTALL_FAILED" | tee -a ../skillsauth-install.log
              exit 1
            }
          cat ../skillsauth-install.log

          # Find the installed skill directory (skillsauth writes under
          # .agents/skills/ or ~/.skillsauth). Search both.
          BRIDGE_RULE_DIR=""
          for base in . .agents "$HOME/.skillsauth" "$HOME/.agents"; do
            [ -d "$base" ] || continue
            found=$(find "$base" -type d -name "cross-chain-bridge-vulnerabilities" 2>/dev/null | head -1 || true)
            if [ -n "$found" ]; then BRIDGE_RULE_DIR="$found"; break; fi
          done

          if [ -z "$BRIDGE_RULE_DIR" ]; then
            echo "BRIDGE_RULE_DIR_NOT_FOUND" | tee -a ../bridge-semgrep.log
            exit 1
          fi
          echo "Bridge rules: $BRIDGE_RULE_DIR"

          SOL_DIRS=$(find . -maxdepth 2 -type d \( -name src -o -name contracts \) \
            -not -path "*/node_modules/*" -not -path "*/lib/*" \
            -not -path "*/dependencies/*" -not -path "*/out/*" | tr '\n' ' ')
          [ -z "$SOL_DIRS" ] && SOL_DIRS="."
          /tmp/venv-semgrep/bin/semgrep --config "$BRIDGE_RULE_DIR" \
            --include="*.sol" --sarif --output ../bridge-semgrep.sarif \
            $SOL_DIRS 2>&1 | tee ../bridge-semgrep.log || true
          [ -s ../bridge-semgrep.sarif ] || {
            echo "BRIDGE_SEMGREP_EMPTY" | tee -a ../bridge-semgrep.log
            exit 1
          }

      # ================================================================
      # STEP 7 — WAKE DETECT
      # ================================================================
      - name: Wake Detect
        working-directory: target
        continue-on-error: true
        run: |
          python3 -m venv /tmp/venv-wake
          /tmp/venv-wake/bin/pip install -q eth-wake
          /tmp/venv-wake/bin/wake detect all --output ../wake-report.json \
            2>&1 | tee ../wake.log
          [ -s ../wake-report.json ] || { echo "FATAL: wake-report.json empty" >&2; exit 1; }

      # ================================================================
      # STEP 8 — HALMOS (Foundry only)
      # ================================================================
      - name: Halmos
        working-directory: target
        continue-on-error: true
        run: |
          PROJECT=$(cut -d= -f2 ../project.txt)
          if [ "$PROJECT" != "foundry" ]; then
            echo "HALMOS_SKIPPED — not a Foundry project" > ../halmos.log
            exit 0
          fi
          python3 -m venv /tmp/venv-halmos
          /tmp/venv-halmos/bin/pip install -q halmos
          /tmp/venv-halmos/bin/halmos --function check_ --loop 5 \
            > ../halmos.log 2>&1 || true
          if grep -qi "Build failed\|Compiler run failed" ../halmos.log; then
            echo "HALMOS_BUILD_FAILED" >> ../halmos.log
          fi

      # ================================================================
      # STEP 9 — MYTHRIL (reuse Foundry solc, --solc-json remappings)
      # ================================================================
      - name: Mythril
        working-directory: target
        continue-on-error: true
        run: |
          : > ../mythril.log
          SOLC_BIN=$(find ~/.svm -name solc -type f 2>/dev/null | head -1)
          echo "Foundry solc: ${SOLC_BIN:-NOT FOUND}" | tee -a ../mythril.log
          if [ -z "$SOLC_BIN" ] || [ ! -x "$SOLC_BIN" ]; then
            echo "MYTHRIL_NO_SOLC — forge build did not provide solc" >> ../mythril.log
            exit 1
          fi
          cp "$SOLC_BIN" /tmp/solc && chmod +x /tmp/solc
          /tmp/solc --version | tee -a ../mythril.log

          # Mythril accepts remappings via --solc-json.
          if [ -s remappings.txt ]; then
            python3 - << 'PY'
          import json, pathlib
          remaps = []
          for line in pathlib.Path("remappings.txt").read_text().splitlines():
              line = line.strip()
              if not line or "=" not in line:
                  continue
              if ":" in line and "=" in line.split(":", 1)[1]:
                  dep, rest = line.split(":", 1)
                  prefix, target = rest.split("=", 1)
                  remaps.append(f"{dep}:{prefix}={target}")
              else:
                  prefix, target = line.split("=", 1)
                  remaps.append(f"{prefix}={target}")
          json.dump({"remappings": remaps}, open("mythril.json", "w"), indent=2)
          print(f"Wrote mythril.json with {len(remaps)} remappings")
          PY
            SOLC_JSON="--solc-json mythril.json"
          else
            SOLC_JSON=""
          fi

          python3 -m venv /tmp/venv-mythril
          /tmp/venv-mythril/bin/pip install -q mythril

          FILES=$(find src contracts . -maxdepth 3 -name "*.sol" 2>/dev/null \
            | grep -v node_modules | grep -v "/lib/" | grep -v "/dependencies/" \
            | grep -v "/test/" | grep -v "/script/" | grep -v "/out/" \
            | head -2 || true)
          [ -z "$FILES" ] && { echo "No source files for Mythril" >> ../mythril.log; exit 1; }

          for f in $FILES; do
            echo "=== Mythril $f ===" >> ../mythril.log
            PATH="/tmp:$PATH" SOLC=/tmp/solc timeout 300 \
              /tmp/venv-mythril/bin/myth analyze "$f" $SOLC_JSON \
                --execution-timeout 280 --max-depth 30 \
                >> ../mythril.log 2>&1 || true
          done
          cat ../mythril.log

      # ================================================================
      # STEP 10 — AUTO-TRIAGE (generic + bridge-specific)
      # ================================================================
      - name: Auto-Triage
        run: |
          python3 - << 'PY'
          import json, os, re, pathlib

          def read_json(p):
              p = pathlib.Path(p)
              if p.exists() and p.stat().st_size > 0:
                  try: return json.loads(p.read_text())
                  except Exception: return None
              return None

          project = pathlib.Path("project.txt").read_text().strip().split("=")[1] \
                    if pathlib.Path("project.txt").exists() else "unknown"

          # --- Slither ---
          slither_high = slither_med = 0
          d = read_json("slither.json")
          slither_ok = d is not None
          if d:
              for x in d.get("results", {}).get("detectors", []):
                  imp = str(x.get("impact", "")).lower()
                  if imp == "high": slither_high += 1
                  elif imp == "medium": slither_med += 1

          # --- Semgrep generic (security rules only) ---
          semgrep_high = semgrep_med = semgrep_low = 0
          d = read_json("semgrep.sarif")
          semgrep_ok = d is not None
          if d:
              for run in d.get("runs", []):
                  for r in run.get("results", []):
                      rid = str(r.get("ruleId", ""))
                      if "solidity.security." in rid: semgrep_high += 1
                      elif "solidity.performance." in rid or "solidity.best-practice." in rid:
                          semgrep_low += 1
                      else: semgrep_med += 1

          # --- SolAST bridge/generic AST findings ---
          solast_high = solast_med = 0
          d = read_json("solast.sarif")
          solast_ok = d is not None
          if d:
              for run in d.get("runs", []):
                  for r in run.get("results", []):
                      lvl = str(r.get("level", "")).lower()
                      rid = str(r.get("ruleId", "")).lower()
                      if lvl == "error" or lvl == "high":
                          solast_high += 1
                      elif lvl == "warning" or lvl == "medium":
                          solast_med += 1
                      elif "bridge" in rid or "cross-chain" in rid or "replay" in rid:
                          solast_high += 1
                      else:
                          solast_med += 1

          # --- SkillsAuth bridge Semgrep findings ---
          bridge_high = bridge_med = 0
          d = read_json("bridge-semgrep.sarif")
          bridge_semgrep_ok = d is not None
          if d:
              for run in d.get("runs", []):
                  for r in run.get("results", []):
                      lvl = str(r.get("level", "")).lower()
                      if lvl in ("error", "high"): bridge_high += 1
                      elif lvl in ("warning", "medium"): bridge_med += 1
                      else: bridge_high += 1   # security bridge rules default HIGH

          # --- Wake ---
          wake_high = 0
          d = read_json("wake-report.json")
          wake_ok = d is not None
          if d:
              txt = pathlib.Path("wake-report.json").read_text(errors="ignore").lower()
              wake_high = len(re.findall(r'"severity"\s*:\s*"high"', txt)) + \
                          len(re.findall(r'"impact"\s*:\s*"high"', txt))

          # --- Halmos ---
          halmos_fail = halmos_ok = halmos_skipped = False
          hp = pathlib.Path("halmos.log")
          if hp.exists():
              txt = hp.read_text(errors="ignore")
              if "HALMOS_SKIPPED" in txt:
                  halmos_skipped = halmos_ok = True
              elif "HALMOS_BUILD_FAILED" in txt or "build failed" in txt.lower():
                  halmos_ok = False
              else:
                  halmos_ok = True
                  halmos_fail = "counterexample" in txt.lower()

          # --- Mythril ---
          mythril_fail = mythril_ok = False
          mp = pathlib.Path("mythril.log")
          if mp.exists():
              txt = mp.read_text(errors="ignore")
              if "MYTHRIL_NO_SOLC" in txt or "Compiler not found" in txt:
                  mythril_ok = False
              else:
                  mythril_ok = True
                  mythril_fail = "SWC-" in txt

          all_ran = all([slither_ok, semgrep_ok, solast_ok,
                         bridge_semgrep_ok, wake_ok, halmos_ok, mythril_ok])

          total_critical = (slither_high + semgrep_high + solast_high +
                            bridge_high + wake_high +
                            (1 if halmos_fail else 0) + (1 if mythril_fail else 0))
          total_medium = slither_med + semgrep_med + solast_med + bridge_med

          if not all_ran:
              verdict = "UNKNOWN"
          elif total_critical > 0:
              verdict = "DEEP-DIVE"
          elif total_medium > 0:
              verdict = "REVIEW-MEDIUM"
          else:
              verdict = "SKIP"

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"## Audit: {os.environ.get('TARGET_REPO','?')} ({project})\n\n")
              f.write("| Tool | HIGH | MEDIUM | Status |\n|---|---|---|---|\n")
              f.write(f"| Slither | {slither_high} | {slither_med} | {'OK' if slither_ok else 'FAILED'} |\n")
              f.write(f"| Semgrep (security) | {semgrep_high} | {semgrep_med} | {'OK' if semgrep_ok else 'FAILED'} |\n")
              f.write(f"| SolAST (bridge AST) | {solast_high} | {solast_med} | {'OK' if solast_ok else 'FAILED'} |\n")
              f.write(f"| Bridge Semgrep (SkillsAuth) | {bridge_high} | {bridge_med} | {'OK' if bridge_semgrep_ok else 'FAILED'} |\n")
              f.write(f"| Wake | {wake_high} | — | {'OK' if wake_ok else 'FAILED'} |\n")
              f.write(f"| Halmos | {'YES' if halmos_fail else 'NO'} | — | {'SKIPPED' if halmos_skipped else 'OK' if halmos_ok else 'FAILED'} |\n")
              f.write(f"| Mythril | {'YES' if mythril_fail else 'NO'} | — | {'OK' if mythril_ok else 'FAILED'} |\n\n")
              f.write(f"**Verdict: `{verdict}`**\n")
              if semgrep_low:
                  f.write(f"\n(Semgrep generic produced {semgrep_low} gas/style findings, excluded.)\n")

          pathlib.Path("verdict.txt").write_text(verdict)
          print(f"VERDICT={verdict}")
          PY
        env:
          TARGET_REPO: ${{ inputs.target_repo }}

      # ================================================================
      # STEP 11 — ARTIFACTS
      # ================================================================
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-${{ github.run_number }}
          path: |
            slither.json
            semgrep.sarif
            solast.sarif
            solast.log
            bridge-semgrep.sarif
            bridge-semgrep.log
            skillsauth-install.log
            wake-report.json
            halmos.log
            mythril.log
            verdict.txt
            forge-build.log
            slither.log
            wake.log
            project.txt
            remappings.backup.txt
