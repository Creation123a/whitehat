name: Aderyn + LLM Map-Reduce Audit

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Input Source Mode'
        required: true
        default: 'current_repo'
        type: choice
        options:
          - current_repo
          - external_github_repo
          - raw_solidity_code
      external_repo_url:
        description: 'GitHub Repo URL (used if mode = external_github_repo)'
        required: false
        type: string
      raw_solidity:
        description: 'Paste Raw Solidity Code (used if mode = raw_solidity_code)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Auditor Repo
        uses: actions/checkout@v4
        with:
          path: auditor

      # ---------------------------------------------------------------
      # Build the `target/` workspace from the chosen input mode
      # ---------------------------------------------------------------
      - name: Setup Target Workspace
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p target

          if [ "$MODE" = "current_repo" ]; then
            cp -a auditor/. target/
            rm -rf target/.github target/.git

          elif [ "$MODE" = "external_github_repo" ]; then
            if [ -z "${{ github.event.inputs.external_repo_url }}" ]; then
              echo "::error::external_repo_url is required for mode=external_github_repo"
              exit 1
            fi
            git clone --depth 1 "${{ github.event.inputs.external_repo_url }}" target
            rm -rf target/.git

          elif [ "$MODE" = "raw_solidity_code" ]; then
            if [ -z "${{ github.event.inputs.raw_solidity }}" ]; then
              echo "::error::raw_solidity is required for mode=raw_solidity_code"
              exit 1
            fi
            mkdir -p target/src
            # Quoted heredoc keeps bash from expanding $ or backticks inside
            # the Solidity source. The expression is substituted by
            # GitHub *before* the shell runs, at column 0 thanks to YAML
            # block-scalar indentation stripping.
            cat << 'RAW_SOLIDITY_EOF' > target/src/InputContract.sol
          ${{ github.event.inputs.raw_solidity }}
          RAW_SOLIDITY_EOF
          else
            echo "::error::Unknown mode: $MODE"
            exit 1
          fi

      # ---------------------------------------------------------------
      # Aderyn (official installer — NOT github.com | sh)
      # ---------------------------------------------------------------
      - name: Install Aderyn
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/cyfrin/aderyn/releases/latest/download/aderyn-installer.sh | bash
          # The installer typically places the binary in a location like ~/.cyfrin/bin or similar.
          # Verify the path; you may need to add it to $GITHUB_PATH.
          export PATH="$HOME/.cyfrin/bin:$PATH"
          aderyn --version || true
      # ---------------------------------------------------------------
      # Run the Map-Reduce pipeline from inside the target workspace.
      # Script lives in the auditor checkout, not the target copy.
      # ---------------------------------------------------------------
      - name: Run Aderyn & LLM Map-Reduce Audit
        working-directory: target
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY:  ${{ secrets.CEREBRAS_API_KEY }}
        run: python3 ../auditor/.github/scripts/audit_pipeline.py

      # ---------------------------------------------------------------
      # Upload the markdown report (and be forgiving if the audit crashed
      # so we don't mask the real error with an "artifact missing" error)
      # ---------------------------------------------------------------
      - name: Upload Final Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solidity-audit-report
          path: target/final-audit-report.md
          if-no-files-found: warn
