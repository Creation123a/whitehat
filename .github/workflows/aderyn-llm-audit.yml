name: Audit Any Repo - Paste Name, It Clones + Audits
on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Paste repo like: Morpho-Organization/morpho-blue"
        required: true
        default: "Creation123a/whitehat"
      target_branch:
        description: "Branch"
        required: false
        default: "main"

permissions:
  contents: read
  security-events: write

jobs:
  audit-any:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ inputs.target_branch }}
          path: target
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 1
          submodules: recursive

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        working-directory: target
        run: |
          forge install --no-commit || true
          forge build || true
          forge remappings > remappings.txt || true

      # SLITHER - isolated venv
      - name: Slither
        working-directory: target
        continue-on-error: true
        run: |
          python3 -m venv /tmp/venv-slither
          /tmp/venv-slither/bin/pip install -q slither-analyzer || true
          /tmp/venv-slither/bin/slither . --exclude-dependencies --json ../slither.json || true
          echo "--- SLITHER JSON SIZE ---"
          wc -c ../slither.json || echo "NO slither.json - Slither failed to run"
          cat ../slither.json | head -c 5000 || true
      # SEMGREP - isolated venv, Solidity only
      - name: Semgrep
        working-directory: target
        continue-on-error: true
        run: |
          python3 -m venv /tmp/venv-semgrep
          /tmp/venv-semgrep/bin/pip install -q semgrep || true
          /tmp/venv-semgrep/bin/semgrep --config p/smart-contracts --include="*.sol" --sarif --output ../semgrep.sarif src contracts 2>/dev/null || /tmp/venv-semgrep/bin/semgrep --config p/smart-contracts --include="*.sol" --sarif --output ../semgrep.sarif . || true

      # WAKE - isolated venv (needs rich<14)
      - name: Wake Detect
        working-directory: target
        continue-on-error: true
        run: |
          python3 -m venv /tmp/venv-wake
          /tmp/venv-wake/bin/pip install -q eth-wake || true
          /tmp/venv-wake/bin/wake detect all --output ../wake-report.json || true

      # HALMOS - isolated venv, FIXED: no --forge-build-options, move script/ aside
      - name: Halmos Symbolic
        working-directory: target
        continue-on-error: true
        run: |
          python3 -m venv /tmp/venv-halmos
          /tmp/venv-halmos/bin/pip install -q halmos || true
          mv script script.bak 2>/dev/null || true
          /tmp/venv-halmos/bin/halmos --function check_ --loop 5 > ../halmos.log 2>&1 || true
          mv script.bak script 2>/dev/null || true
          cat ../halmos.log || true
          if grep -qi "Build failed\|Compiler run failed" ../halmos.log; then echo "HALMOS_BUILD_FAILED" >> ../halmos.log; fi

      # MYTHRIL - isolated venv, FIXED: remappings from forge, not file
      - name: Mythril Critical Files Only
        working-directory: target
        continue-on-error: true
        run: |
          python3 -m venv /tmp/venv-mythril
          /tmp/venv-mythril/bin/pip install -q mythril || true
          : > ../mythril.log
          forge remappings > remappings.txt || true
          cat remappings.txt >> ../mythril.log
          for f in $(find src contracts -name "*.sol" 2>/dev/null | head -2); do
            echo "=== Mythril $f ===" >> ../mythril.log
            timeout 300 /tmp/venv-mythril/bin/myth analyze "$f" --execution-timeout 280 --max-depth 30 >> ../mythril.log 2>&1 || true
          done
          cat ../mythril.log || true

      # AUTO-TRIAGE - unchanged, already filters non-.sol + UNKNOWN
      - name: Auto-Triage
        run: |
          python3 - << 'PY'
          import json, os, re
          slither_high = slither_med = 0
          semgrep_high = semgrep_med = 0
          wake_high = 0
          halmos_fail = False
          mythril_high = False
          halmos_unknown = False
          mythril_unknown = False
          if os.path.exists("slither.json"):
              try:
                  d = json.load(open("slither.json"))
                  dets = d.get("results", {}).get("detectors", []) if isinstance(d, dict) else []
                  for x in dets:
                      imp = str(x.get("impact", "")).lower()
                      if imp == "high": slither_high += 1
                      elif imp == "medium": slither_med += 1
              except Exception as e: print(f"Slither parse error: {e}")
          if os.path.exists("semgrep.sarif"):
              try:
                  d = json.load(open("semgrep.sarif"))
                  for run in d.get("runs", []):
                      for r in run.get("results", []):
                          loc = str(r.get("locations", [])).lower()
                          if ".sol" not in loc: continue
                          lvl = str(r.get("level", "")).lower()
                          if lvl == "error": semgrep_high += 1
                          elif lvl == "warning": semgrep_med += 1
              except Exception as e: print(f"Semgrep parse error: {e}")
          if os.path.exists("wake-report.json"):
              try:
                  txt = open("wake-report.json", errors="ignore").read()
                  s = txt.lower()
                  wake_high = len(re.findall(r'"severity"\s*:\s*"high"', s)) + len(re.findall(r'"impact"\s*:\s*"high"', s))
              except Exception as e: print(f"Wake parse error: {e}")
          if os.path.exists("halmos.log"):
              txt = open("halmos.log", errors="ignore").read()
              if "counterexample" in txt.lower(): halmos_fail = True
              if "HALMOS_BUILD_FAILED" in txt or "build failed" in txt.lower(): halmos_unknown = True
          if os.path.exists("mythril.log"):
              txt = open("mythril.log", errors="ignore").read()
              if "SWC-" in txt: mythril_high = True
              if "Solc experienced a fatal error" in txt or "not found: File not found" in txt: mythril_unknown = True
          total_critical = slither_high + semgrep_high + wake_high + (1 if halmos_fail else 0) + (1 if mythril_high else 0)
          total_medium = slither_med + semgrep_med
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"## Audit Result for {os.environ.get('TARGET_REPO', 'unknown')}\n\n")
              f.write(f"| Tool | HIGH | MEDIUM | Status |\n| --- | --- | --- | --- |\n")
              f.write(f"| Slither | {slither_high} | {slither_med} | OK |\n")
              f.write(f"| Semgrep (Solidity only) | {semgrep_high} | {semgrep_med} | OK |\n")
              f.write(f"| Wake | {wake_high} | - | OK |\n")
              f.write(f"| Halmos | {'YES' if halmos_fail else 'NO'} | - | {'UNKNOWN' if halmos_unknown else 'OK'} |\n")
              f.write(f"| Mythril | {'YES' if mythril_high else 'NO'} | - | {'UNKNOWN' if mythril_unknown else 'OK'} |\n\n")
              if halmos_unknown or mythril_unknown: f.write(f"## 🟡 UNKNOWN - Halmos/Mythril did not run\n")
              elif total_critical > 0: f.write(f"## 🔴 DEEP-DIVE - {total_critical} Critical\n")
              elif total_medium > 0: f.write(f"## 🟡 REVIEW MEDIUM - {total_medium} Medium\n")
              else: f.write(f"## 🟢 SKIP - 0 Critical, 0 Medium\n")
          open("verdict.txt","w").write("UNKNOWN" if (halmos_unknown or mythril_unknown) else "DEEP-DIVE" if total_critical>0 else "REVIEW-MEDIUM" if total_medium>0 else "SKIP")
          PY
        env:
          TARGET_REPO: ${{ inputs.target_repo }}

      - name: Upload All Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-${{ github.run_number }}
          path: |
            slither.json
            semgrep.sarif
            wake-report.json
            halmos.log
            mythril.log
            verdict.txt
