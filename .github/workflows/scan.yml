name: Base Protocol Spot-AMM Exposure Scan

on:
  workflow_dispatch:
    inputs:
      fork_block:
        description: 'Override fork block (leave empty to auto-fetch latest)'
        required: false
        default: ''
      format:
        description: 'Output format'
        required: true
        default: 'json'
        type: choice
        options:
          - json
          - text
      timeout:
        description: 'Pipeline timeout (e.g. 20m, 1h)'
        required: true
        default: '20m'
      min_protocols:
        description: 'Minimum protocols attached to a market to scan it'
        required: true
        default: '2'
      min_tvl:
        description: 'Minimum protocol TVL in USD to survive dust filter'
        required: true
        default: '50000'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Install Foundry (Anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build scanner
        run: go build -o scanner .

      - name: Mask RPC URL
        run: echo "::add-mask::${{ secrets.BASE_FORK_URL }}"

      - name: Resolve fork block
        id: fork
        env:
          BASE_FORK_URL: ${{ secrets.BASE_FORK_URL }}
          OVERRIDE: ${{ inputs.fork_block }}
        run: |
          set -euo pipefail
          if [ -n "${OVERRIDE:-}" ]; then
            BLOCK="$OVERRIDE"
            echo "Using explicit override block: $BLOCK"
          else
            HEAD=$(cast block-number --rpc-url "$BASE_FORK_URL")
            BLOCK=$((HEAD - 100))
            echo "Fetched head: $HEAD, using: $BLOCK"
          fi
          echo "block=$BLOCK" >> "$GITHUB_OUTPUT"

      - name: Run scan
        env:
          BASE_FORK_URL: ${{ secrets.BASE_FORK_URL }}
          FORK_BLOCK:    ${{ steps.fork.outputs.block }}
          FORMAT:        ${{ inputs.format }}
          TIMEOUT:       ${{ inputs.timeout }}
          MIN_PROTOCOLS: ${{ inputs.min_protocols }}
          MIN_TVL:       ${{ inputs.min_tvl }}
        run: |
          set -euo pipefail
          ARGS=()
          ARGS+=(--fork-url "$BASE_FORK_URL")
          ARGS+=(--fork-block "$FORK_BLOCK")
          ARGS+=(--format "$FORMAT")
          ARGS+=(--out report.json)
          ARGS+=(--timeout "$TIMEOUT")
          ARGS+=(--min-protocols "$MIN_PROTOCOLS")
          ARGS+=(--min-tvl "$MIN_TVL")
          ./scanner "${ARGS[@]}"

      - name: Show report summary
        if: always()
        run: |
          if [ -f report.json ]; then
            echo "--- report.json (first 8 KB) ---"
            head -c 8192 report.json || true
            echo
          else
            echo "report.json not produced"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-report-${{ steps.fork.outputs.block }}
          path: report.json
          if-no-files-found: warn
          retention-days: 30
