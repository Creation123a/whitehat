name: Base Spot-AMM Scanner

on:
  workflow_dispatch:
    inputs:
      fork_block:
        description: 'Base block number to fork at'
        required: true
        default: '30000000'
      format:
        description: 'Output format'
        required: true
        default: 'json'
        type: choice
        options:
          - json
          - text
      timeout:
        description: 'Pipeline timeout (e.g. 20m, 1h)'
        required: true
        default: '20m'
      op_public_rpc:
        description: 'O-1: public RPC only'
        required: false
        default: false
        type: boolean
      op_anon_team:
        description: 'O-2: anonymous team'
        required: false
        default: false
        type: boolean
      op_no_legal:
        description: 'O-3: no legal entity'
        required: false
        default: false
        type: boolean
      op_tracking_stale:
        description: 'O-4: tracking obsolete'
        required: false
        default: false
        type: boolean

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Install Foundry (Anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build scanner
        run: go build -o scanner .

      - name: Mask RPC URL
        run: echo "::add-mask::${{ secrets.BASE_FORK_URL }}"

      - name: Run scan
        env:
          BASE_FORK_URL: ${{ secrets.BASE_FORK_URL }}
          FORK_BLOCK:    ${{ inputs.fork_block }}
          FORMAT:        ${{ inputs.format }}
          TIMEOUT:       ${{ inputs.timeout }}
        run: |
          set -euo pipefail

          ARGS=()
          ARGS+=(--fork-url "$BASE_FORK_URL")
          ARGS+=(--fork-block "$FORK_BLOCK")
          ARGS+=(--format "$FORMAT")
          ARGS+=(--out report.json)
          ARGS+=(--timeout "$TIMEOUT")

          if [ "${{ inputs.op_public_rpc }}"     = "true" ]; then ARGS+=(--op-public-rpc);     fi
          if [ "${{ inputs.op_anon_team }}"      = "true" ]; then ARGS+=(--op-anon-team);      fi
          if [ "${{ inputs.op_no_legal }}"       = "true" ]; then ARGS+=(--op-no-legal);       fi
          if [ "${{ inputs.op_tracking_stale }}" = "true" ]; then ARGS+=(--op-tracking-stale); fi

          ./scanner "${ARGS[@]}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-report-${{ inputs.fork_block }}
          path: |
            report.json
            report.txt
          if-no-files-found: warn
          retention-days: 30
