name: Base Protocol Spot-AMM Exposure Scan

on:
  workflow_dispatch:
    inputs:
      category:
        description: 'DefiLlama category keyword'
        required: true
        default: 'Lending'
        type: choice
        options:
          - Lending
          - Yield
          - Yield Aggregator
          - CDP
          - Leveraged Farming
          - Dexs
          - Basis Trading
          - Derivatives
          - Farm
          - Liquid Staking
          - RWA
      fork_block:
        description: 'Override fork block (leave empty to auto-fetch latest)'
        required: false
        default: ''
      format:
        description: 'Output format'
        required: true
        default: 'json'
        type: choice
        options:
          - json
          - text
      timeout:
        description: 'Pipeline timeout (e.g. 30m, 1h)'
        required: true
        default: '45m'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Setup Python Environment (For Slither)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Slither
        run: |
          pip install slither-analyzer

      - name: Cache Cargo Dependencies (For Aderyn)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Aderyn
        run: |
          if ! command -v aderyn &> /dev/null; then
            cargo install aderyn
          fi

      - name: Cache Ollama Models
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ${{ runner.os }}-ollama-qwen-0.5b

      - name: Install and Run Ultra-Lightweight Local LLM
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull qwen2.5-coder:0.5b-instruct-q4_K_M

      - name: Install Foundry (Anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.0.0

      - name: Tidy modules
        run: go mod tidy

      - name: Build scanner
        run: go build -o scanner .

      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets.BASE_FORK_URL }}"
          echo "::add-mask::${{ secrets.ETHERSCAN_API_KEY }}"

      - name: Resolve fork block
        id: fork
        env:
          BASE_FORK_URL: ${{ secrets.BASE_FORK_URL }}
          OVERRIDE: ${{ inputs.fork_block }}
        run: |
          set -euo pipefail
          if [ -n "${OVERRIDE:-}" ]; then
            BLOCK="$OVERRIDE"
            echo "Using explicit override block: $BLOCK"
          else
            HEAD=$(cast block-number --rpc-url "$BASE_FORK_URL")
            BLOCK=$((HEAD - 100))
            echo "Fetched head: $HEAD, using: $BLOCK"
          fi
          echo "block=$BLOCK" >> "$GITHUB_OUTPUT"

      - name: Run scan
        env:
          BASE_FORK_URL:      ${{ secrets.BASE_FORK_URL }}
          ETHERSCAN_API_KEY:  ${{ secrets.ETHERSCAN_API_KEY }}
          FORK_BLOCK:         ${{ steps.fork.outputs.block }}
          CATEGORY:           ${{ inputs.category }}
          FORMAT:             ${{ inputs.format }}
          TIMEOUT:            ${{ inputs.timeout }}
        run: |
          set -euo pipefail
          ARGS=()
          ARGS+=(--fork-url "$BASE_FORK_URL")
          ARGS+=(--fork-block "$FORK_BLOCK")
          ARGS+=(--category "$CATEGORY")
          ARGS+=(--format "$FORMAT")
          ARGS+=(--out report.json)
          ARGS+=(--timeout "$TIMEOUT")
          ./scanner "${ARGS[@]}"

      - name: Show report summary
        if: always()
        run: |
          if [ -f report.json ]; then
            echo "--- report.json (first 8 KB) ---"
            head -c 8192 report.json || true
            echo
          else
            echo "report.json not produced"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-report-${{ inputs.category }}-${{ steps.fork.outputs.block }}
          path: report.json
          if-no-files-found: warn
          retention-days: 30
